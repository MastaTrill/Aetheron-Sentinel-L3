# Cloud Build configuration for Aetheron Sentinel FastAPI Gateway
steps:
  # Build container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/aetheron-sentinel-api:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/aetheron-sentinel-api:latest', '-f', 'Dockerfile', '.']

  # Push image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/aetheron-sentinel-api:$COMMIT_SHA']

  # Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'aetheron-sentinel-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/aetheron-sentinel-api:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8000'

images:
  - 'gcr.io/$PROJECT_ID/aetheron-sentinel-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/aetheron-sentinel-api:latest'
