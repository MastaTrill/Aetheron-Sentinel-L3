name: Temporary Lockfile CRLF Normalize

on:
  push:
    branches:
      - chore/root-dependency-hardening-2026-08-12

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/root-dependency-hardening-2026-08-12
          fetch-depth: 0
      - name: Restore repository lockfile CRLF convention
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('package-lock.json')
          data = path.read_bytes().replace(b'\r\n', b'\n').replace(b'\n', b'\r\n')
          path.write_bytes(data)
          PY
      - name: Commit normalized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: preserve lockfile line endings"
          git push origin HEAD:chore/root-dependency-hardening-2026-08-12
