name: Regenerate transitive dependency lockfile

on:
  push:
    branches:
      - codex/remediate-transitive-high-deps
    paths:
      - sentinel-l3-v1.0/pnpm-workspace.yaml
      - .github/workflows/regenerate-transitive-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/remediate-transitive-high-deps
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.16.1 --activate
      - name: Regenerate and verify lockfile
        working-directory: sentinel-l3-v1.0
        run: |
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sentinel-l3-v1.0/pnpm-lock.yaml
          git diff --cached --quiet || git commit -m 'chore: regenerate pnpm lockfile'
          git push origin HEAD:codex/remediate-transitive-high-deps
