name: Repair js-yaml lock once

on:
  push:
    branches:
      - ci/jsyaml-repair-251
    paths:
      - .github/workflows/repair-jsyaml-once.yml

permissions:
  contents: write

jobs:
  repair-jsyaml:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/jsyaml-repair-251
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Pin patched js-yaml and regenerate lockfile
        run: |
          npm pkg set 'overrides.js-yaml=4.3.1'
          npm install --package-lock-only --legacy-peer-deps
      - name: Commit patched dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required"
          else
            git commit -m "chore: pin patched js-yaml 4.3.1"
            git push origin HEAD:ci/jsyaml-repair-251
          fi
      - name: Verify high-severity toolchain audit
        run: npm audit --audit-level=high
