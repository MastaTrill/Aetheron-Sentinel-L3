name: PR Testing Claims Guardrail

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-testing-claims:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Write PR body to file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node -e "require('node:fs').writeFileSync('pr_body.md', process.env.PR_BODY || '')"

      - name: Validate testing claims
        run: node scripts/validate-pr-testing-claims.cjs pr_body.md

      - name: Run validator unit tests
        run: node test/validate-pr-testing-claims.test.cjs
