name: Sentinel Environment Diagnostics

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  deployments: read
  actions: read

jobs:
  diagnose:
    if: >-
      github.event.issue.number == 169 &&
      github.event.comment.body == '/sentinel-env-diagnose' &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Base Sepolia environment metadata
        id: inspect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          env_json="$(mktemp)"
          secrets_json="$(mktemp)"
          vars_json="$(mktemp)"

          env_status=ok
          secrets_status=ok
          vars_status=ok

          if ! gh api "repos/${GITHUB_REPOSITORY}/environments/base-sepolia" > "$env_json" 2>/tmp/env.err; then
            env_status=unavailable
            printf '{}\n' > "$env_json"
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/environments/base-sepolia/secrets" > "$secrets_json" 2>/tmp/secrets.err; then
            secrets_status=unavailable
            printf '{"secrets":[]}\n' > "$secrets_json"
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/environments/base-sepolia/variables" > "$vars_json" 2>/tmp/vars.err; then
            vars_status=unavailable
            printf '{"variables":[]}\n' > "$vars_json"
          fi

          reviewers="$(jq '[.protection_rules[]? | select(.type=="required_reviewers") | .reviewers[]?] | length' "$env_json")"
          wait_timer="$(jq '[.protection_rules[]? | select(.type=="wait_timer") | .wait_timer] | first // 0' "$env_json")"
          protected_branches="$(jq -r '.deployment_branch_policy.protected_branches // false' "$env_json")"
          custom_policies="$(jq -r '.deployment_branch_policy.custom_branch_policies // false' "$env_json")"

          secret_names="$(jq -r '[.secrets[]?.name] | join(",")' "$secrets_json")"
          variable_names="$(jq -r '[.variables[]?.name] | join(",")' "$vars_json")"

          has_secret() { case ",$secret_names," in *",$1,"*) echo yes ;; *) echo no ;; esac; }
          has_var_or_secret() {
            case ",$secret_names,$variable_names," in *",$1,"*) echo yes ;; *) echo no ;; esac
          }

          {
            echo "env_status=$env_status"
            echo "secrets_status=$secrets_status"
            echo "vars_status=$vars_status"
            echo "reviewers=$reviewers"
            echo "wait_timer=$wait_timer"
            echo "protected_branches=$protected_branches"
            echo "custom_policies=$custom_policies"
            echo "rpc_present=$(has_var_or_secret BASE_TESTNET_RPC_URL)"
            echo "deployer_present=$(has_secret DEPLOYER_PRIVATE_KEY)"
            echo "owner_present=$(has_secret OWNER_ADDRESS)"
            echo "monitors_present=$(has_secret MONITOR_ADDRESSES)"
            echo "basescan_present=$(has_secret BASESCAN_API_KEY)"
          } >> "$GITHUB_OUTPUT"

      - name: Post redacted environment report
        env:
          GH_TOKEN: ${{ github.token }}
          ENV_STATUS: ${{ steps.inspect.outputs.env_status }}
          SECRETS_STATUS: ${{ steps.inspect.outputs.secrets_status }}
          VARS_STATUS: ${{ steps.inspect.outputs.vars_status }}
          REVIEWERS: ${{ steps.inspect.outputs.reviewers }}
          WAIT_TIMER: ${{ steps.inspect.outputs.wait_timer }}
          PROTECTED_BRANCHES: ${{ steps.inspect.outputs.protected_branches }}
          CUSTOM_POLICIES: ${{ steps.inspect.outputs.custom_policies }}
          RPC_PRESENT: ${{ steps.inspect.outputs.rpc_present }}
          DEPLOYER_PRESENT: ${{ steps.inspect.outputs.deployer_present }}
          OWNER_PRESENT: ${{ steps.inspect.outputs.owner_present }}
          MONITORS_PRESENT: ${{ steps.inspect.outputs.monitors_present }}
          BASESCAN_PRESENT: ${{ steps.inspect.outputs.basescan_present }}
        run: |
          cat > /tmp/report.md <<EOF
          ## Base Sepolia protected-environment diagnostics

          No secret values were read or printed.

          | Check | Result |
          |---|---|
          | Environment metadata API | \`${ENV_STATUS}\` |
          | Secret-name metadata API | \`${SECRETS_STATUS}\` |
          | Variable-name metadata API | \`${VARS_STATUS}\` |
          | Required reviewers configured | \`${REVIEWERS}\` |
          | Wait timer (minutes) | \`${WAIT_TIMER}\` |
          | Protected-branch policy | \`${PROTECTED_BRANCHES}\` |
          | Custom deployment branch policies | \`${CUSTOM_POLICIES}\` |
          | BASE_TESTNET_RPC_URL present | \`${RPC_PRESENT}\` |
          | DEPLOYER_PRIVATE_KEY present | \`${DEPLOYER_PRESENT}\` |
          | OWNER_ADDRESS present | \`${OWNER_PRESENT}\` |
          | MONITOR_ADDRESSES present | \`${MONITORS_PRESENT}\` |
          | BASESCAN_API_KEY present | \`${BASESCAN_PRESENT}\` |

          This workflow reports metadata only. Governance-owner validity is checked separately by the strict readiness workflow on-chain.
          EOF
          gh issue comment 169 --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md
