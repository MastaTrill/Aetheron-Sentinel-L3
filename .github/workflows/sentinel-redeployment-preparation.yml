name: SENTINEL Redeployment Preparation

on:
  pull_request:
    paths:
      - 'scripts/reconstruct-legacy-sentinel-launch.mjs'
      - 'scripts/validate-sentinel-deployment-manifest.mjs'
      - 'scripts/simulate-sentinel-base-sepolia.mjs'
      - 'scripts/execute-sentinel-base-sepolia-rehearsal.mjs'
      - '.github/workflows/sentinel-redeployment-preparation.yml'
      - '.github/workflows/sentinel-base-sepolia-rehearsal.yml'
      - 'release-evidence/sentinel-mainnet/redeployment/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct-legacy-input:
    name: Reconstruct legacy launch input (read only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_RPC_URLS: https://mainnet.base.org,https://base.llamarpc.com,https://base.drpc.org,https://1rpc.io/base,https://base-rpc.publicnode.com
      SENTINEL_CREATE_FROM_BLOCK: '42400000'
      SENTINEL_CREATE_TO_BLOCK: '42600000'
      SENTINEL_CREATE_LOG_CHUNK: '5000'
      SENTINEL_LEGACY_RECONSTRUCTION_OUTPUT: /tmp/sentinel-redeployment/legacy-launch-inputs.json
      SENTINEL_REDEPLOYMENT_MANIFEST: release-evidence/sentinel-mainnet/redeployment/deployment-manifest.json
      SENTINEL_BASE_SEPOLIA_REHEARSAL_OUTPUT: /tmp/sentinel-redeployment/base-sepolia-rehearsal.json
      BASE_SEPOLIA_RPC_URLS: https://sepolia.base.org,https://base-sepolia-rpc.publicnode.com,https://base-sepolia.drpc.org
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Decode canonical Airlock.create calldata
        run: |
          mkdir -p /tmp/sentinel-decoder
          cp scripts/reconstruct-legacy-sentinel-launch.mjs /tmp/sentinel-decoder/reconstruct.mjs
          cp scripts/simulate-sentinel-base-sepolia.mjs /tmp/sentinel-decoder/simulate.mjs
          cd /tmp/sentinel-decoder
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund ethers@6.17.0
          node reconstruct.mjs
      - name: Validate exact fail-closed manifest
        run: node scripts/validate-sentinel-deployment-manifest.mjs
      - name: Simulate exact launch on Base Sepolia
        run: node /tmp/sentinel-decoder/simulate.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-redeployment-preparation-${{ github.run_id }}
          path: |
            /tmp/sentinel-redeployment/legacy-launch-inputs.json
            /tmp/sentinel-redeployment/base-sepolia-rehearsal.json
          if-no-files-found: error
          retention-days: 14
