name: Capture Pinned SENTINEL Evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/verify-canonical-token.sh
      - scripts/verify-canonical-v4-state.sh
      - .github/workflows/capture-sentinel-pinned-evidence.yml
  push:
    branches:
      - evidence/sentinel-second-rpc
    paths:
      - scripts/verify-canonical-token.sh
      - scripts/verify-canonical-v4-state.sh
      - .github/workflows/capture-sentinel-pinned-evidence.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Generate block-pinned evidence
        shell: bash
        env:
          BASE_RPC_URL: https://base-rpc.publicnode.com
          SENTINEL_SNAPSHOT_BLOCK: 49143277
        run: |
          set -euo pipefail
          OUT="release-evidence/sentinel-mainnet/second-rpc"
          mkdir -p "$OUT"
          bash scripts/verify-canonical-token.sh > "$OUT/token-state.txt"
          bash scripts/verify-canonical-v4-state.sh > "$OUT/v4-state.txt"
          (
            cd "$OUT"
            sha256sum token-state.txt v4-state.txt > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload pinned evidence
        uses: actions/upload-artifact@v6
        with:
          name: sentinel-second-rpc-pinned-evidence
          path: release-evidence/sentinel-mainnet/second-rpc/
          if-no-files-found: error
          retention-days: 7
