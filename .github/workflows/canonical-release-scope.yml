name: Canonical Sentinel Release Scope

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'script/**'
      - 'config/**'
      - 'site/**'
      - 'docs/**'
      - 'PROJECT_STATUS.md'
      - 'DEPLOYMENT_COMPLETE_SUMMARY_MAINNET.md'
      - 'RELEASE_NOTES_MAINNET_2026-04-27.md'
      - 'sentinel-l3-v1.0/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'script/**'
      - 'config/**'
      - 'site/**'
      - 'docs/**'
      - 'PROJECT_STATUS.md'
      - 'DEPLOYMENT_COMPLETE_SUMMARY_MAINNET.md'
      - 'RELEASE_NOTES_MAINNET_2026-04-27.md'
      - 'sentinel-l3-v1.0/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release scope and deprecated-tree isolation
        run: node scripts/validate-canonical-release-scope.mjs
