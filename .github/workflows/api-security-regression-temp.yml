name: API security regression (temporary)

on:
  push:
    branches:
      - fix/deep-repo-audit-2026-09-02
    paths:
      - .github/workflows/api-security-regression-temp.yml
      - requirements-api.txt
      - test/test_api_security.py
      - test/test_sentinel_gateway.py
      - sentinel/api.py
      - sentinel/main.py
      - sentinel/health.py
      - sentinel/utils.py
      - sentinel_gateway_prototype.py
      - scripts/monitor-and-deploy.mjs
      - Dockerfile

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  api-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-api.txt
      - name: Install production and test dependencies
        run: pip install -r requirements-api.txt httpx==0.28.1 pytest==9.1.1 ruff
      - name: Lint production API and Python regression tests
        run: ruff check sentinel/ sentinel_gateway_prototype.py test/test_api_security.py test/test_sentinel_gateway.py --output-format=github
      - name: Run Sentinel API and gateway regression tests
        run: pytest test/test_api_security.py test/test_sentinel_gateway.py -q --tb=short
        env:
          SENTINEL_API_KEY: test-only-ci-key
      - name: Verify no tracked credentials remain
        run: node scripts/scan-tracked-secrets.mjs
      - name: Build production API image
        run: docker build -t aetheron-sentinel:deep-audit .
