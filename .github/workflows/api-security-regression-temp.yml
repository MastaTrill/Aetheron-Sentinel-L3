name: API security regression (temporary)

on:
  push:
    branches:
      - fix/deep-repo-audit-2026-09-02
    paths:
      - .github/workflows/api-security-regression-temp.yml
      - test/test_api_security.py
      - sentinel/api.py
      - sentinel/main.py
      - Dockerfile

permissions:
  contents: read

jobs:
  api-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install minimal API test dependencies
        run: >-
          pip install
          fastapi==0.136.0
          httpx==0.28.1
          structlog
          python-dotenv==1.2.2
          slowapi==0.1.10
          prometheus-fastapi-instrumentator
          pytest==9.1.1
      - run: pytest test/test_api_security.py -q --tb=short
