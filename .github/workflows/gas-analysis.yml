name: Gas Analysis Quality Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'contracts/**'
      - 'test/SentinelCore.gas.test.js'

jobs:
  gas-profile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Core Gas Analysis
        run: npm run test:gas:core
        env:
          REPORT_GAS: true

      - name: Upload Gas Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gas-report
          path: gas-report.txt
          retention-days: 30
