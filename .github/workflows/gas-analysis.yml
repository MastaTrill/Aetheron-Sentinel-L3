name: Gas Analysis Quality Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'contracts/**'
      - 'test/SentinelCore.gas.test.js'

jobs:
  gas-profile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Core Gas Analysis
        run: npm run test:gas:core
        env:
          REPORT_GAS: true