name: Repair npm lock once

on:
  push:
    branches:
      - ci/lock-repair-251
    paths:
      - .github/workflows/repair-npm-lock-once.yml

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/lock-repair-251
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --legacy-peer-deps
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: regenerate npm lockfile for secure override"
            git push origin HEAD:ci/lock-repair-251
          fi
      - name: Verify high-severity audit gate
        run: npm audit --audit-level=high
