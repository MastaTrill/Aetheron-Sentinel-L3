name: Repair npm lock once

on:
  push:
    branches:
      - ci/lock-repair-251
    paths:
      - .github/workflows/repair-npm-lock-once.yml

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/lock-repair-251
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply fully patched override and regenerate lockfile
        run: |
          npm pkg set 'overrides.brace-expansion=5.0.9'
          npm install --package-lock-only --legacy-peer-deps
      - name: Commit patched dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required"
          else
            git commit -m "chore: pin patched brace-expansion 5.0.9"
            git push origin HEAD:ci/lock-repair-251
          fi
      - name: Verify high-severity audit gate
        run: npm audit --audit-level=high
