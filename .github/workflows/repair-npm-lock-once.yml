name: Repair npm lock once

on:
  push:
    branches:
      - release/populate-platform-authorization-metadata
    paths:
      - .github/workflows/repair-npm-lock-once.yml

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/populate-platform-authorization-metadata
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply secure override and regenerate lockfile
        run: |
          # package.json already pins the secure maintenance release; npm writes the exact lock entries.
          npm install --package-lock-only --legacy-peer-deps
          npm audit --audit-level=high
      - name: Commit repaired dependency metadata
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency metadata changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: repair high-severity npm audit finding"
          git push origin HEAD:release/populate-platform-authorization-metadata
