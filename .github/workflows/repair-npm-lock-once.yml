name: Repair npm lock once

on:
  push:
    branches:
      - release/populate-platform-authorization-metadata
    paths:
      - .github/workflows/repair-npm-lock-once.yml

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/populate-platform-authorization-metadata
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Repair lockfile with npm audit
        run: |
          npm audit fix --package-lock-only --legacy-peer-deps
          npm audit --audit-level=high
      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: repair npm audit lockfile"
          git push origin HEAD:release/populate-platform-authorization-metadata
