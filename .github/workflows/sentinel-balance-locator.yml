name: Sentinel Balance Locator

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: read
  issues: write

jobs:
  locate:
    if: >-
      github.event.pull_request.title == 'run: sentinel readiness' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOYER: '0x15b9F8ecedafD69Eb1dD93E51fE522690Bf6B7C2'
    steps:
      - name: Query Base balances
        id: balances
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' | tee /tmp/base-balances.txt
          const address = process.env.DEPLOYER;
          const networks = [
            ['Base Sepolia', 84532, 'https://sepolia.base.org'],
            ['Base Mainnet', 8453, 'https://mainnet.base.org'],
          ];

          async function rpc(url, method, params) {
            const response = await fetch(url, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'User-Agent': 'sentinel-readiness-balance-locator/1.0',
              },
              body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }),
            });
            if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
            const payload = await response.json();
            if (payload.error) throw new Error(`${url}: ${JSON.stringify(payload.error)}`);
            return payload.result;
          }

          console.log(`Deployer: ${address}`);
          for (const [name, expectedChainId, url] of networks) {
            try {
              const chainId = Number(BigInt(await rpc(url, 'eth_chainId', [])));
              if (chainId !== expectedChainId) {
                throw new Error(`expected chain ID ${expectedChainId}, got ${chainId}`);
              }
              const wei = BigInt(await rpc(url, 'eth_getBalance', [address, 'latest']));
              const whole = wei / 10n ** 18n;
              const fraction = (wei % 10n ** 18n).toString().padStart(18, '0');
              console.log(`${name} (${chainId}): ${whole}.${fraction} ETH`);
            } catch (error) {
              console.log(`${name}: QUERY FAILED — ${error.message}`);
            }
          }
          NODE

      - name: Report balances to launch gate
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '## Sentinel deployer balance locator'
            echo
            echo '- **Workflow run:** https://github.com/'"$GITHUB_REPOSITORY"'/actions/runs/'"$GITHUB_RUN_ID"
            echo '- **No transactions were sent.**'
            echo
            echo '```text'
            cat /tmp/base-balances.txt 2>/dev/null || echo 'Balance output was not produced.'
            echo '```'
          } > /tmp/balance-report.md
          gh issue comment 169 --repo "$GITHUB_REPOSITORY" --body-file /tmp/balance-report.md
