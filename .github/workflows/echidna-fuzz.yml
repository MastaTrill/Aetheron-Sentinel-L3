name: Echidna Fuzz (Interceptor Properties)

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'test/**'
      - 'echidna.yaml'
      - '.github/workflows/echidna-fuzz.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'test/**'
      - 'echidna.yaml'
  schedule:
    - cron: '0 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: echidna-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  echidna:
    name: Echidna property fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Install Echidna
        run: |
          curl -L https://github.com/crytic/echidna/releases/download/v2.2.6/echidna-2.2.6-x86_64-linux.tar.gz \
            | tar -xz -C /usr/local/bin
          echidna --version

      - name: Build contracts
        run: forge build

      - name: Run Echidna (if properties present)
        run: |
          set -euo pipefail
          if [ -f echidna.yaml ]; then
            CONFIG=echidna.yaml
          elif [ -f echidna.config.yml ]; then
            CONFIG=echidna.config.yml
          else
            echo "No echidna config found; using defaults against contracts/"
            CONFIG=""
          fi

          # Prefer dedicated property contract if present
          TARGET=""
          for c in contracts/test/EchidnaInterceptorProperties.sol \
                   contracts/test/Invariants.sol \
                   test/echidna/EchidnaInterceptorProperties.sol; do
            if [ -f "$c" ]; then
              TARGET="$c"
              break
            fi
          done

          if [ -z "$TARGET" ]; then
            echo "No Echidna property contract found yet."
            echo "Scaffolded path: contracts/test/EchidnaInterceptorProperties.sol"
            echo "Skipping fail gate until properties are authored."
            exit 0
          fi

          if [ -n "$CONFIG" ]; then
            echidna "$TARGET" --contract EchidnaInterceptorProperties --config "$CONFIG"
          else
            echidna "$TARGET" --contract EchidnaInterceptorProperties --test-mode property
          fi
