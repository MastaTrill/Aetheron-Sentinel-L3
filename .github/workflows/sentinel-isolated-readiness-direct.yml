name: Sentinel Isolated Readiness Direct

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: read
  deployments: read
  issues: write

concurrency:
  group: sentinel-isolated-readiness-direct
  cancel-in-progress: true

jobs:
  readiness:
    if: >-
      github.event.pull_request.title == 'run: sentinel readiness' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_PROFILE: sentinel-guardrails-v1
      DEPLOY_NETWORK: base-sepolia
      DEPLOY_ENVIRONMENT: base-sepolia
      BASE_TESTNET_RPC_URL: https://sepolia.base.org
      DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
      SENTINEL_OWNER: '0xA1B9CF0F48F815cE80ed2aB203fa7c0C8299A0fB'
      MONITOR_ADDRESSES: '0xA4737aa4b1E8a3C8f221BE9E55F5BDa307eCC1Fa'
      KNOWN_DEPLOYER_ADDRESS: '0x15b9F8ecedafD69Eb1dD93E51fE522690Bf6B7C2'
      MIN_DEPLOYER_BALANCE_ETH: '0.05'
      RELEASE_COMMIT: a2e61a646129bc5744e6f5f734823fb5604b58e5
      DEPLOYMENT_MANIFEST_PATH: deployments/baseSepolia-sentinel-guardrails-v1.json
    steps:
      - name: Checkout isolated release candidate
        uses: actions/checkout@v6
        with:
          ref: a2e61a646129bc5744e6f5f734823fb5604b58e5
          submodules: recursive
          persist-credentials: false

      - name: Initialize readiness evidence
        run: |
          mkdir -p artifacts/base-sepolia-readiness
          : > artifacts/base-sepolia-readiness/base-sepolia-readiness.log
          : > artifacts/base-sepolia-readiness/key-normalization.log
          : > artifacts/base-sepolia-readiness/funding.log

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Install dependencies
        id: dependencies
        run: npm ci --legacy-peer-deps

      - name: Canonicalize repository deployer key without printing it
        id: key
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const logPath = 'artifacts/base-sepolia-readiness/key-normalization.log';
          const raw = String(process.env.DEPLOYER_PRIVATE_KEY || '');
          const fail = (message, metadata = {}) => {
            fs.appendFileSync(
              logPath,
              `KEY NORMALIZATION: FAIL\n${message}\n${JSON.stringify(metadata)}\n`
            );
            throw new Error(message);
          };

          let value = raw.trim().replace(/^\uFEFF/, '');
          if (!value) fail('The repository-scoped DEPLOYER_PRIVATE_KEY secret is empty.', { rawLength: raw.length });

          try {
            const parsed = JSON.parse(value);
            if (parsed && typeof parsed === 'object') {
              value = String(
                parsed.DEPLOYER_PRIVATE_KEY ||
                  parsed.deployerPrivateKey ||
                  parsed.privateKey ||
                  parsed.PRIVATE_KEY ||
                  ''
              ).trim();
            }
          } catch {
            // Non-JSON secret formats are handled below.
          }

          const stripQuotes = input => {
            let output = input;
            while (
              output.length >= 2 &&
              ((output.startsWith('"') && output.endsWith('"')) ||
                (output.startsWith("'") && output.endsWith("'")))
            ) {
              output = output.slice(1, -1).trim();
            }
            return output;
          };

          value = stripQuotes(value);
          value = value
            .replace(/^(?:export\s+)?(?:DEPLOYER_PRIVATE_KEY|PRIVATE_KEY)\s*=\s*/i, '')
            .trim();
          value = stripQuotes(value)
            .replace(/\\[rnt]/g, '')
            .replace(/\s+/g, '');

          const canonicalize = candidate => {
            let output = String(candidate || '');
            if (/^0X[0-9a-fA-F]{64}$/.test(output)) output = `0x${output.slice(2)}`;
            if (/^[0-9a-fA-F]{64}$/.test(output)) output = `0x${output}`;
            return output;
          };

          value = canonicalize(value);
          const tokenMatches = raw.match(/(?<![0-9a-fA-F])(?:0[xX])?[0-9a-fA-F]{64}(?![0-9a-fA-F])/g) || [];
          const candidates = [...new Set(tokenMatches.map(canonicalize))].filter(candidate =>
            /^0x[0-9a-fA-F]{64}$/.test(candidate)
          );

          if (!/^0x[0-9a-fA-F]{64}$/.test(value) && candidates.length === 1) {
            value = candidates[0];
          }

          if (!/^0x[0-9a-fA-F]{64}$/.test(value)) {
            fail('The stored repository key cannot be canonicalized to one 0x-prefixed 32-byte hexadecimal key.', {
              rawLength: raw.length,
              compactLength: value.length,
              uniqueHexCandidates: candidates.length,
            });
          }

          console.log(`::add-mask::${value}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `DEPLOYER_PRIVATE_KEY=${value}\n`);
          fs.appendFileSync(
            logPath,
            `KEY NORMALIZATION: PASS\nA canonical 32-byte key was loaded without printing it.\n${JSON.stringify({ rawLength: raw.length, uniqueHexCandidates: candidates.length })}\n`
          );
          NODE

      - name: Generate masked ephemeral key for offline Hardhat gates
        id: ephemeral_key
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const key = `0x${crypto.randomBytes(32).toString('hex')}`;
          console.log(`::add-mask::${key}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `SIMULATION_PRIVATE_KEY=${key}\n`);
          NODE

      - name: Validate deployment environment configuration
        id: environment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRE_DEPLOYMENT_REVIEWERS: 'false'
        run: npm run security:deployment-environment

      - name: Validate frozen release scope
        id: scope
        run: npm run security:release-scope

      - name: Verify known deployer funding on Base Sepolia
        id: funding
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' 2>&1 | tee artifacts/base-sepolia-readiness/funding.log
          import { JsonRpcProvider, formatEther, parseEther } from 'ethers';

          const provider = new JsonRpcProvider(process.env.BASE_TESTNET_RPC_URL, {
            name: 'base-sepolia',
            chainId: 84532,
          });
          const network = await provider.getNetwork();
          if (Number(network.chainId) !== 84532) {
            throw new Error(`Unexpected chain ID ${network.chainId}`);
          }
          const address = process.env.KNOWN_DEPLOYER_ADDRESS;
          const balance = await provider.getBalance(address);
          const minimum = parseEther(process.env.MIN_DEPLOYER_BALANCE_ETH);
          console.log('DEPLOYER FUNDING CHECK');
          console.log(`Chain ID: ${network.chainId}`);
          console.log(`Deployer: ${address}`);
          console.log(`Balance: ${formatEther(balance)} ETH`);
          console.log(`Minimum: ${process.env.MIN_DEPLOYER_BALANCE_ETH} ETH`);
          if (balance < minimum) {
            throw new Error('Known deployer balance is below the required minimum.');
          }
          console.log('Funding status: PASS');
          NODE

      - name: Validate repository key, signer, balance, and provisional addresses
        id: preflight
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm run preflight:base-sepolia 2>&1 | tee artifacts/base-sepolia-readiness/base-sepolia-readiness.log

      - name: Audit release and toolchain dependencies
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            npm run security:audit
            npm run security:audit:toolchain
          } 2>&1 | tee artifacts/base-sepolia-readiness/audits.log

      - name: Compile exact deployment artifacts
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            DEPLOYER_PRIVATE_KEY="$SIMULATION_PRIVATE_KEY" OWNER_PRIVATE_KEY="$SIMULATION_PRIVATE_KEY" npm run compile || {
              echo 'Initial compile failed; retrying once after a short delay.'
              sleep 5
              DEPLOYER_PRIVATE_KEY="$SIMULATION_PRIVATE_KEY" OWNER_PRIVATE_KEY="$SIMULATION_PRIVATE_KEY" npm run compile
            }
          } 2>&1 | tee artifacts/base-sepolia-readiness/compile.log

      - name: Run release regression tests
        id: release_tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYER_PRIVATE_KEY="$SIMULATION_PRIVATE_KEY" OWNER_PRIVATE_KEY="$SIMULATION_PRIVATE_KEY" npm run test:release 2>&1 | tee artifacts/base-sepolia-readiness/release-tests.log

      - name: Run Foundry build and tests
        id: foundry
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            forge build --sizes
            forge test -vvv
          } 2>&1 | tee artifacts/base-sepolia-readiness/foundry.log

      - name: Simulate exact deployment with ephemeral signer
        id: simulation
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYER_PRIVATE_KEY="$SIMULATION_PRIVATE_KEY" OWNER_PRIVATE_KEY="$SIMULATION_PRIVATE_KEY" npm run mainnet:simulate 2>&1 | tee artifacts/base-sepolia-readiness/simulation.log

      - name: Collect simulation evidence
        if: always()
        run: |
          if [ -f /tmp/sentinel-guardrails-simulation.json ]; then
            cp /tmp/sentinel-guardrails-simulation.json artifacts/base-sepolia-readiness/
          fi

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-sepolia-readiness-direct-${{ github.run_id }}
          path: artifacts/base-sepolia-readiness
          if-no-files-found: warn

      - name: Report result to launch gate
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > /tmp/sentinel-readiness-report.md <<'EOF'
          ## Automated Base Sepolia readiness result — isolated diagnostics

          - **Overall:** `${{ job.status }}`
          - **Release candidate:** `a2e61a646129bc5744e6f5f734823fb5604b58e5`
          - **Workflow run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - **Broadcast:** disabled; this workflow cannot send a deployment transaction
          - **Configuration note:** the live funding check uses the known deployer address and official public Base Sepolia RPC. Offline Hardhat gates use a fresh ephemeral signer. Actual deployment still requires the protected environment key and approved governance owner.

          | Gate | Outcome |
          |---|---|
          | Dependencies | `${{ steps.dependencies.outcome }}` |
          | Repository key canonicalization | `${{ steps.key.outcome }}` |
          | Ephemeral test key | `${{ steps.ephemeral_key.outcome }}` |
          | Environment configuration | `${{ steps.environment.outcome }}` |
          | Release scope | `${{ steps.scope.outcome }}` |
          | Known deployer funding | `${{ steps.funding.outcome }}` |
          | Repository key / signer preflight | `${{ steps.preflight.outcome }}` |
          | Audits | `${{ steps.audit.outcome }}` |
          | Compile | `${{ steps.compile.outcome }}` |
          | Release tests | `${{ steps.release_tests.outcome }}` |
          | Foundry | `${{ steps.foundry.outcome }}` |
          | Exact local simulation | `${{ steps.simulation.outcome }}` |

          The workflow artifact contains redacted diagnostic logs for every gate.
          EOF
          gh issue comment 169 --repo "$GITHUB_REPOSITORY" --body-file /tmp/sentinel-readiness-report.md
