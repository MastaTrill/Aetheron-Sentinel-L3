name: Security Lockfile Repair

on:
  push:
    branches:
      - security/patch-readiness-audit-2026-08-09

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Patch vulnerable dependency versions
        run: |
          npm pkg set dependencies.hono=4.13.1
          npm pkg set overrides.postcss=8.5.23
      - name: Regenerate locked dependency graph
        run: npm install --package-lock-only --legacy-peer-deps
      - name: Enforce production and toolchain audits
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
      - name: Commit repaired dependency metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Dependency metadata already current.'
            exit 0
          fi
          git commit -m 'security: patch Hono and PostCSS advisories'
          git push origin HEAD:security/patch-readiness-audit-2026-08-09
