name: Release Adversarial Safety Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  release-adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Reject simulated or placeholder production scope
        run: npm run security:release-scope
      - name: Compile release artifacts
        run: npm run compile
      - name: Exercise paused handoff and claim reentrancy regression
        run: npm run test:release
