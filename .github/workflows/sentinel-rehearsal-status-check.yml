name: SENTINEL Rehearsal Status Probe

on:
  push:
    branches:
      - codex/sentinel-rehearsal-status-check
    paths:
      - '.github/workflows/sentinel-rehearsal-status-check.yml'

permissions:
  actions: read
  contents: read
  deployments: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_RUN_ID: '30685496721'
      TARGET_JOB_ID: '91330306011'
    steps:
      - name: Report protected rehearsal failure metadata
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID" \
            --jq '{id,status,conclusion,event,head_branch,head_sha,run_attempt,created_at,updated_at,html_url}')"
          job_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$TARGET_JOB_ID" \
            --jq '{id,name,status,conclusion,started_at,completed_at,runner_name,runner_group_name,labels,steps,check_run_url,html_url}')"
          pending_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/pending_deployments" \
            --jq '[.[] | {environment:.environment.name,state,wait_timer,wait_timer_started_at,current_user_can_approve,reviewers}]')"
          deployment_json="$(gh api --method GET "repos/$GITHUB_REPOSITORY/deployments" \
            -f sha='a5ee170d46a04311ebafe4eb8e7966f9750b56ab' \
            -f environment='base-sepolia' \
            -F per_page=10 \
            --jq '[.[] | {id,ref,sha,environment,created_at,updated_at,statuses_url}]')"
          body="$(printf 'Protected rehearsal diagnostics for run `%s`:\n\n```json\n%s\n%s\n%s\n%s\n```\n\nNo deployment secrets were accessed by this probe.' "$TARGET_RUN_ID" "$run_json" "$job_json" "$pending_json" "$deployment_json")"
          gh issue comment 217 --repo "$GITHUB_REPOSITORY" --body "$body"
