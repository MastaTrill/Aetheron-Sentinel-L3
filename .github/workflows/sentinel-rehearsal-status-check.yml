name: SENTINEL Rehearsal Status Probe

on:
  push:
    branches:
      - codex/sentinel-rehearsal-status-check
    paths:
      - '.github/workflows/sentinel-rehearsal-status-check.yml'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_RUN_ID: '30715464157'
    steps:
      - name: Report exact protected rehearsal status
        shell: bash
        run: |
          set -euo pipefail
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID" --jq '{id,head_sha,status,conclusion,html_url,created_at,updated_at}')"
          body=$(printf 'Read-only status for exact Base Sepolia run `%s`:\n\n```json\n%s\n```\n\nNo approval, signing, or broadcast capability is available to this probe.' "$TARGET_RUN_ID" "$(jq . <<< "$run")")
          gh issue comment 217 --repo "$GITHUB_REPOSITORY" --body "$body"
