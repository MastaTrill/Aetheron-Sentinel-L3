name: SENTINEL Rehearsal Status Probe

on:
  push:
    branches:
      - codex/sentinel-rehearsal-status-check
    paths:
      - '.github/workflows/sentinel-rehearsal-status-check.yml'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report-main-head-runs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: f792c787d85e33faec2ab885e1d787c8c0f9b731
    steps:
      - name: Report workflows for current main head
        shell: bash
        run: |
          set -euo pipefail
          all="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -F per_page=100)"
          runs="$(jq -c --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha) | {id,name,status,conclusion,event,html_url,created_at,updated_at}] | sort_by(.created_at)' <<< "$all")"
          body=$(printf 'Workflow audit for current main head `%s`:\n\n```json\n%s\n```\n\nRead-only; no secrets, approval, signing, or broadcast capability.' "$TARGET_SHA" "$(jq . <<< "$runs")")
          gh issue comment 217 --repo "$GITHUB_REPOSITORY" --body "$body"
