name: SENTINEL Rehearsal Status Probe

on:
  push:
    branches:
      - codex/sentinel-rehearsal-status-check
    paths:
      - '.github/workflows/sentinel-rehearsal-status-check.yml'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 073ac9c6aa1c14016167101da422a6a617689ae7
      TARGET_WORKFLOW: sentinel-base-sepolia-rehearsal.yml
    steps:
      - name: Report fresh protected rehearsal status
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs" -f branch='main' -f event='push' -F per_page=20 --jq ".workflow_runs[] | select(.head_sha == \"$TARGET_SHA\") | {id,status,conclusion,html_url,created_at,updated_at}" | head -n 1)"
          if [[ -z "$run_json" ]]; then
            body="Fresh protected rehearsal probe: no run found yet for merge \`$TARGET_SHA\`."
          else
            body=$(printf 'Fresh protected rehearsal for `%s`:\n\n```json\n%s\n```\n\nThis read-only probe has no access to deployment secrets and cannot approve, sign, or broadcast transactions.' "$TARGET_SHA" "$(jq . <<< "$run_json")")
          fi
          gh issue comment 217 --repo "$GITHUB_REPOSITORY" --body "$body"
