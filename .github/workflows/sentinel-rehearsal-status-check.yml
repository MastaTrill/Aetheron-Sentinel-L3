name: SENTINEL Rehearsal Status Probe

on:
  push:
    branches:
      - codex/sentinel-rehearsal-status-check
    paths:
      - '.github/workflows/sentinel-rehearsal-status-check.yml'

permissions:
  actions: read
  checks: read
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_RUN_ID: '30685496721'
      TARGET_JOB_ID: '91330306011'
    steps:
      - name: Report protected rehearsal annotations
        shell: bash
        run: |
          set -euo pipefail
          annotations="$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$TARGET_JOB_ID/annotations" \
            --jq '[.[] | {annotation_level,title,message,raw_details,path,start_line,end_line}]')"
          body="$(printf 'Protected rehearsal failure annotations for run `%s`:\n\n```json\n%s\n```\n\nNo deployment secrets were accessed by this probe.' "$TARGET_RUN_ID" "$annotations")"
          gh issue comment 217 --repo "$GITHUB_REPOSITORY" --body "$body"
