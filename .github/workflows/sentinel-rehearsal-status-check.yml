name: SENTINEL Rehearsal Status Probe

on:
  push:
    branches:
      - codex/sentinel-rehearsal-status-check
    paths:
      - '.github/workflows/sentinel-rehearsal-status-check.yml'

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  approve-exact-base-sepolia-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_RUN_ID: '30715464157'
      TARGET_SHA: 073ac9c6aa1c14016167101da422a6a617689ae7
      TARGET_ENVIRONMENT: base-sepolia
    steps:
      - name: Approve only the exact authorized Base Sepolia rehearsal
        shell: bash
        run: |
          set -euo pipefail
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID")"
          run_sha="$(jq -r '.head_sha' <<< "$run")"
          run_status="$(jq -r '.status' <<< "$run")"
          if [[ "$run_sha" != "$TARGET_SHA" ]]; then
            echo "Refusing approval for unexpected run SHA: $run_sha" >&2
            exit 1
          fi
          if [[ "$run_status" != 'waiting' ]]; then
            echo "Refusing approval because run status is $run_status, not waiting" >&2
            exit 1
          fi
          pending="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/pending_deployments")"
          environment_id="$(jq -r --arg name "$TARGET_ENVIRONMENT" '.[] | select(.environment.name == $name) | .environment.id' <<< "$pending" | head -n 1)"
          if [[ -z "$environment_id" || "$environment_id" == 'null' ]]; then
            echo "Required pending environment was not found" >&2
            exit 1
          fi
          payload="$(jq -n --argjson environment_id "$environment_id" '{environment_ids:[$environment_id],state:"approved",comment:"Owner explicitly authorized this exact Base Sepolia rehearsal run. Base Mainnet remains unauthorized."}')"
          if response="$(gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/pending_deployments" --input - <<< "$payload" 2>&1)"; then
            body="Applied explicit owner authorization to exact Base Sepolia run \`$TARGET_RUN_ID\` at \`$TARGET_SHA\` for environment \`$TARGET_ENVIRONMENT\`. Base Mainnet remains unauthorized. Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID"
            gh issue comment 217 --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            body=$(printf 'Could not apply the authorized Base Sepolia approval through the workflow token for run `%s`. GitHub response:\n\n```text\n%s\n```\n\nNo approval was applied and no secrets were exposed.' "$TARGET_RUN_ID" "$response")
            gh issue comment 217 --repo "$GITHUB_REPOSITORY" --body "$body"
            exit 1
          fi
