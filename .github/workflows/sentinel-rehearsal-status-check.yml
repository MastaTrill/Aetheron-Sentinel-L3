name: SENTINEL Rehearsal Status Probe

on:
  push:
    branches:
      - codex/sentinel-rehearsal-status-check
    paths:
      - '.github/workflows/sentinel-rehearsal-status-check.yml'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  inspect-exact-base-sepolia-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_RUN_ID: '30715464157'
    steps:
      - name: Record exact pending deployment gate
        shell: bash
        run: |
          set -euo pipefail
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID" --jq '{id,head_sha,status,conclusion,html_url,actor:.actor.login,triggering_actor:.triggering_actor.login,created_at,updated_at}')"
          pending="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/pending_deployments")"
          body=$(printf 'Exact protected-gate inspection for run `%s`:\n\nRun:\n```json\n%s\n```\nPending deployments:\n```json\n%s\n```\n\nRead-only inspection; no approval, signing, or broadcast performed.' "$TARGET_RUN_ID" "$(jq . <<< "$run")" "$(jq . <<< "$pending")")
          gh issue comment 217 --repo "$GITHUB_REPOSITORY" --body "$body"
