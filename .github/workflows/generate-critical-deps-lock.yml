name: Generate critical dependency lockfile

on:
  pull_request:
    branches: [main]
    paths:
      - 'sentinel-l3-v1.0/pnpm-workspace.yaml'
      - '.github/workflows/generate-critical-deps-lock.yml'

permissions:
  contents: write

jobs:
  lockfile:
    if: github.head_ref == 'codex/remediate-critical-dependencies'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@10
      - name: Generate lockfile
        run: >-
          pnpm --dir sentinel-l3-v1.0 install
          --lockfile-only
          --no-frozen-lockfile
          --ignore-scripts
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- sentinel-l3-v1.0/pnpm-lock.yaml; then
            echo "Lockfile is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sentinel-l3-v1.0/pnpm-lock.yaml
          git commit -m "security: regenerate pnpm lockfile"
          git push
