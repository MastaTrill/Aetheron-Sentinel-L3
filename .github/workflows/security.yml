name: Release Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  security-events: write

jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run security:release-scope
      - name: Run production dependency audit
        run: npm audit --omit=dev --omit=optional --audit-level=high --json > npm-audit-production.json
      - name: Upload production dependency audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: npm-audit-production
          path: npm-audit-production.json
          if-no-files-found: error
          retention-days: 7
      - run: npm run security:audit:toolchain

  slither:
    needs: release-policy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        contract: [SentinelInterceptor, CircuitBreaker, RateLimiter]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install slither-analyzer
      - run: forge build
      - name: Fail on high-severity findings in the production scope
        run: >-
          slither contracts/${{ matrix.contract }}.sol
          --config-file slither.config.json
          --fail-high
          --sarif results-${{ matrix.contract }}.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results-${{ matrix.contract }}.sarif
          category: slither-${{ matrix.contract }}
