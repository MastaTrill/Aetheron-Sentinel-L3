name: Release Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  security-events: write

jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run security:release-scope
      - name: Run production dependency audit
        run: npm run security:audit -- --json > npm-audit-production.json
      - name: Upload production dependency audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: npm-audit-production
          path: npm-audit-production.json
          if-no-files-found: error
          retention-days: 7
      - run: npm run security:audit:toolchain

  slither:
    needs: release-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Slither once
        run: pip install slither-analyzer
      - name: Build release contracts once
        run: forge build
      - name: Scan SentinelInterceptor
        run: >-
          slither contracts/SentinelInterceptor.sol
          --config-file slither.config.json
          --fail-high
          --sarif results-SentinelInterceptor.sarif
      - name: Scan CircuitBreaker
        run: >-
          slither contracts/CircuitBreaker.sol
          --config-file slither.config.json
          --fail-high
          --sarif results-CircuitBreaker.sarif
      - name: Scan RateLimiter
        run: >-
          slither contracts/RateLimiter.sol
          --config-file slither.config.json
          --fail-high
          --sarif results-RateLimiter.sarif
      - name: Upload SentinelInterceptor SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results-SentinelInterceptor.sarif
          category: slither-SentinelInterceptor
      - name: Upload CircuitBreaker SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results-CircuitBreaker.sarif
          category: slither-CircuitBreaker
      - name: Upload RateLimiter SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results-RateLimiter.sarif
          category: slither-RateLimiter
