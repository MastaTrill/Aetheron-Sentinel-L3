name: Concord Enterprise Governance

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate PR governance policy
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('Pull request payload is required.');
              return;
            }

            const failures = [];
            const title = pr.title || '';
            const labels = (pr.labels || []).map(label => label.name);
            const author = pr.user?.login || '';
            const isBot = pr.user?.type === 'Bot' || author === 'dependabot[bot]';

            // Title: require [L3] for human PRs. Dependabot titles are allowed as-is.
            if (!isBot && !/\[L3\]/i.test(title)) {
              failures.push('PR title must include [L3] (human-authored PRs).');
            }

            // Labels: accept either the governance pair OR the standard Dependabot labels.
            // Repo has both `github_actions` (underscore) and Dependabot may emit `github-actions`.
            const hasSecurity = labels.includes('security');
            const hasGithubActions =
              labels.includes('github_actions') || labels.includes('github-actions');
            const hasDependencies = labels.includes('dependencies');
            const hasDocs = labels.includes('documentation');

            const labelOk =
              (hasSecurity && hasGithubActions) ||
              hasDependencies ||
              hasDocs ||
              (hasSecurity && hasDependencies);

            if (!labelOk) {
              failures.push(
                'Missing governance labels. Need one of: (security + github_actions), dependencies, or documentation.'
              );
            }

            if (pr.draft) {
              failures.push('PR must be marked ready for review.');
            }

            if (failures.length) {
              core.setFailed(failures.join('\n'));
            } else {
              core.info('Governance gate passed (title + labels + ready-for-review).');
            }
