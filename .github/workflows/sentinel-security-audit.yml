name: Sentinel L3 Security & Build Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-and-test-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Linter
        run: npm run lint

      - name: Run Hardhat & Unit Test Suite
        run: |
          set -o pipefail
          npm test 2>&1 | tee hardhat-test.log

      - name: Upload Hardhat test diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hardhat-test-diagnostics
          path: hardhat-test.log
          if-no-files-found: warn
          retention-days: 7

      - name: Generate Gas Benchmark Report
        run: node scripts/gas-benchmark-report.cjs

      - name: Train AI Threat Model Simulation
        run: node scripts/train-threat-model.cjs

      - name: Install Dashboard Dependencies
        run: npm --prefix dashboard ci --legacy-peer-deps

      - name: Build Dashboard Frontend
        run: npm --prefix dashboard run build

  capture-pinned-evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Capture one Base block
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          BLOCK="$(cast block-number --rpc-url https://base-rpc.publicnode.com)"
          echo "block=$BLOCK" >> "$GITHUB_OUTPUT"

      - name: Generate block-pinned evidence
        shell: bash
        env:
          BASE_RPC_URL: https://base-rpc.publicnode.com
          SENTINEL_SNAPSHOT_BLOCK: ${{ steps.snapshot.outputs.block }}
        run: |
          set -euo pipefail
          OUT="release-evidence/sentinel-mainnet/second-rpc"
          mkdir -p "$OUT"
          bash scripts/verify-canonical-token.sh > "$OUT/token-state.txt"
          bash scripts/verify-canonical-v4-state.sh > "$OUT/v4-state.txt"
          (
            cd "$OUT"
            sha256sum token-state.txt v4-state.txt > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload pinned evidence
        uses: actions/upload-artifact@v6
        with:
          name: sentinel-second-rpc-pinned-evidence
          path: release-evidence/sentinel-mainnet/second-rpc/
          if-no-files-found: error
          retention-days: 7
