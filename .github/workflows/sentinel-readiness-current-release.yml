name: Sentinel Current Release Readiness

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: sentinel-current-release-readiness
  cancel-in-progress: true

env:
  RELEASE_COMMIT: f165e345f6909ffb8c3d9eab1f152aa5bd23e97b
  RELEASE_PROFILE: sentinel-guardrails-v1
  DEPLOY_NETWORK: base-sepolia
  DEPLOY_ENVIRONMENT: base-sepolia
  DEPLOYMENT_MANIFEST_PATH: deployments/baseSepolia-sentinel-guardrails-v1.json

jobs:
  authorize:
    if: >-
      github.event.issue.number == 169 &&
      github.event.comment.body == '/sentinel-readiness-current'
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.auth.outputs.allowed }}
    steps:
      - name: Authorize repository owner only
        id: auth
        shell: bash
        env:
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "${COMMENT_AUTHOR,,}" = "${REPOSITORY_OWNER,,}" ]; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
          fi

  readiness:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: base-sepolia
    env:
      BASE_TESTNET_RPC_URL: ${{ secrets.BASE_TESTNET_RPC_URL }}
      DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
      SENTINEL_OWNER: ${{ secrets.OWNER_ADDRESS }}
      MONITOR_ADDRESSES: ${{ secrets.MONITOR_ADDRESSES }}
      MIN_DEPLOYER_BALANCE_ETH: '0.05'
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v7
        with:
          ref: f165e345f6909ffb8c3d9eab1f152aa5bd23e97b
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate protected deployment environment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRE_DEPLOYMENT_REVIEWERS: 'true'
        run: npm run security:deployment-environment

      - name: Validate governance owner contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { ethers } from 'ethers';

          const rpcUrl = process.env.BASE_TESTNET_RPC_URL;
          const owner = process.env.SENTINEL_OWNER;
          if (!rpcUrl) throw new Error('BASE_TESTNET_RPC_URL is not configured');
          if (!ethers.isAddress(owner)) throw new Error('OWNER_ADDRESS is not a valid EVM address');

          const provider = new ethers.JsonRpcProvider(rpcUrl);
          const code = await provider.getCode(owner);
          if (code === '0x') {
            throw new Error('OWNER_ADDRESS must be a deployed Safe or compatible OpenZeppelin timelock on Base Sepolia');
          }

          let safeValid = false;
          try {
            const safe = new ethers.Contract(owner, [
              'function getOwners() view returns (address[])',
              'function getThreshold() view returns (uint256)'
            ], provider);
            const [owners, threshold] = await Promise.all([safe.getOwners(), safe.getThreshold()]);
            safeValid = owners.length >= 3 && threshold >= 2n;
          } catch {}

          let timelockValid = false;
          if (!safeValid) {
            try {
              const timelock = new ethers.Contract(owner, [
                'function getMinDelay() view returns (uint256)'
              ], provider);
              const minDelay = await timelock.getMinDelay();
              timelockValid = minDelay >= 172800n;
            } catch {}
          }

          if (!safeValid && !timelockValid) {
            throw new Error('OWNER_ADDRESS is deployed but does not satisfy Safe >=2-of-3 or timelock >=48h governance policy');
          }
          console.log('Governance owner policy: PASS');
          NODE

      - name: Validate frozen release scope
        run: npm run security:release-scope

      - name: Validate Base Sepolia RPC, signer, balance, and addresses
        run: npm run preflight:base-sepolia

      - name: Audit release and toolchain dependencies
        run: |
          set -euo pipefail
          npm run security:audit
          npm run security:audit:toolchain

      - name: Compile exact deployment artifacts
        run: npm run compile

      - name: Run release regression tests
        run: npm run test:release

      - name: Run Foundry build and tests
        run: |
          set -euo pipefail
          forge build --sizes
          forge test -vvv

      - name: Simulate exact deployment without broadcast
        run: npm run mainnet:simulate

      - name: Upload simulation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: current-release-readiness-${{ github.run_id }}
          path: |
            /tmp/sentinel-guardrails-simulation.json
            deployments/baseSepolia-sentinel-guardrails-v1.json
          if-no-files-found: warn

      - name: Report readiness success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 169 --repo "$GITHUB_REPOSITORY" --body "## Current release candidate readiness: PASS\n\n- Release commit: \`f165e345f6909ffb8c3d9eab1f152aa5bd23e97b\`\n- Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n- Broadcast: disabled\n- Governance: protected OWNER_ADDRESS validated as Safe >=2-of-3 or timelock >=48h\n- Deployment reviewers: required\n- Next gate: immutable release tag and explicit mainnet authorization"

      - name: Report readiness failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 169 --repo "$GITHUB_REPOSITORY" --body "## Current release candidate readiness: FAIL\n\n- Release commit: \`f165e345f6909ffb8c3d9eab1f152aa5bd23e97b\`\n- Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n- Broadcast: disabled\n- Result: one or more fail-closed readiness gates failed. Open the workflow run above for the exact failed step and redacted logs."
