name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'test/**'
      - 'scripts/**'
      - 'deploy/**'
      - 'config/**'
      - 'lib/**'
      - 'src/**'
      - 'public/**'
      - 'app/**'
      - 'pages/**'
      - 'foundry.toml'
      - 'remappings.txt'
      - 'hardhat.config.*'
      - 'next.config.*'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.eslintrc.json'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'test/**'
      - 'scripts/**'
      - 'deploy/**'
      - 'config/**'
      - 'lib/**'
      - 'src/**'
      - 'public/**'
      - 'app/**'
      - 'pages/**'
      - 'foundry.toml'
      - 'remappings.txt'
      - 'hardhat.config.*'
      - 'next.config.*'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.eslintrc.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  validate:
    name: Build, test and release policy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate frozen release scope
        run: npm run security:release-scope

      - name: Compile exact deployment artifacts
        run: npm run compile

      - name: Run release regression tests
        run: npm run test:release

      - name: Foundry build
        run: forge build --sizes

      - name: Foundry tests
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: forge test -vvv

      - name: Enforce gas snapshot
        run: forge snapshot --check --no-match-contract AetheronRetainerVaultInvariant

      - name: Lint
        run: npm run lint

      - name: Build web surface
        run: npm run build:web
