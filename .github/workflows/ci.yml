name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  safety:
    name: Repository safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code_changed: ${{ steps.changes.outputs.code_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Scan tracked files for potential secrets
        run: node scripts/scan-tracked-secrets.mjs

      - name: Validate canonical release scope and retired-tree isolation
        run: node scripts/validate-canonical-release-scope.mjs

      - name: Detect code-relevant changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed="$(git diff --name-only "$PR_BASE" "$PR_HEAD")"
          elif [ -n "${BEFORE:-}" ] && ! printf '%s' "$BEFORE" | grep -Eq '^0{40}$'; then
            changed="$(git diff --name-only "$BEFORE" "$HEAD_SHA")"
          else
            changed="$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")"
          fi

          printf '%s\n' "$changed"

          if printf '%s\n' "$changed" | grep -Eq '^(contracts/|test/|script/|scripts/|sentinel/|sentinel_gateway_prototype\.py$|supabase/|deploy/|config/|lib/|src/|public/|app/|pages/|requirements(-gateway)?\.txt$|pytest\.ini$|foundry\.toml$|remappings\.txt$|hardhat\.config\.|next\.config\.|tsconfig[^/]*\.json$|package(-lock)?\.json$|\.eslintrc\.json$|\.github/workflows/ci\.yml$)'; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          fi

  gateway-tests:
    name: Sentinel gateway billing tests
    needs: safety
    if: needs.safety.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-gateway.txt

      - name: Install gateway dependencies
        run: pip install -r requirements-gateway.txt

      - name: Run focused gateway billing tests
        run: >-
          python -m pytest
          test/test_sentinel_gateway.py
          test/test_billing_store.py
          test/test_entitlements.py
          test/test_billing_api.py
          -q

  validate:
    name: Build, test and release policy
    needs: safety
    if: needs.safety.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate frozen release scope
        run: npm run security:release-scope

      - name: Compile exact deployment artifacts
        run: npm run compile

      - name: Run release regression tests
        run: npm run test:release

      - name: Foundry build
        run: forge build --sizes

      - name: Foundry tests
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: forge test -vvv

      - name: Enforce gas snapshot
        run: forge snapshot --check --no-match-contract AetheronRetainerVaultInvariant

      - name: Lint
        run: npm run lint

      - name: Build web surface
        run: npm run build:web
