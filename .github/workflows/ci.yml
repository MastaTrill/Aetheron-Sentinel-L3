name: CI

on:
  push:
    branches: [main, fix/deep-repo-audit-2026-09-02]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  # ── 1. Repository safety & secret scan ──────────────────────────────────────
  safety:
    name: Repository safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code_changed: ${{ steps.changes.outputs.code_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '24'

      - name: Scan tracked files for potential secrets
        run: node scripts/scan-tracked-secrets.mjs

      - name: Validate canonical release scope and retired-tree isolation
        run: node scripts/validate-canonical-release-scope.mjs

      - name: Detect code-relevant changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed="$(git diff --name-only "$PR_BASE" "$PR_HEAD")"
          elif [ -n "${BEFORE:-}" ] && ! printf '%s' "$BEFORE" | grep -Eq '^0{40}$'; then
            changed="$(git diff --name-only "$BEFORE" "$HEAD_SHA")"
          else
            changed="$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")"
          fi

          printf '%s\n' "$changed"

          if printf '%s\n' "$changed" | grep -Eq '^(contracts/|test/|script/|scripts/|deploy/|config/|lib/|src/|public/|app/|pages/|sentinel/|foundry\.toml$|remappings\.txt$|hardhat\.config\.|next\.config\.|tsconfig[^/]*\.json$|package(-lock)?\.json$|requirements(-api)?\.txt$|\.eslintrc\.json$|Dockerfile$|\.github/workflows/ci\.yml$)'; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. Python API: lint + test + Docker build ───────────────────────────────
  python-api:
    name: Python API (lint · test · Docker)
    needs: safety
    if: needs.safety.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install production and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt httpx==0.28.1 pytest==9.1.1 ruff==0.16.5

      - name: Lint production API and Python regression tests
        run: >-
          ruff check
          sentinel/
          sentinel_gateway_prototype.py
          test/test_api_security.py
          test/test_sentinel_gateway.py
          --output-format=github

      - name: Run Sentinel API and gateway regression tests
        env:
          SENTINEL_API_KEY: testkey
        run: >-
          pytest
          test/test_api_security.py
          test/test_sentinel_gateway.py
          -q
          --tb=short

      - name: Build Docker image
        run: docker build -t aetheron-sentinel:l3 .

      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && github.ref == 'refs/heads/main' }}
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/aetheron-sentinel:l3
          docker tag aetheron-sentinel:l3 $IMAGE_NAME
          docker push $IMAGE_NAME

  # ── 3. Solidity: compile · test · gas snapshot ──────────────────────────────
  validate:
    name: Solidity (build · test · gas)
    needs: safety
    if: needs.safety.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate frozen release scope
        run: npm run security:release-scope

      - name: Compile exact deployment artifacts
        run: npm run compile

      - name: Run release regression tests
        run: npm run test:release

      - name: Foundry build
        run: forge build --sizes

      - name: Foundry tests
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: forge test -vvv

      - name: Enforce gas snapshot
        run: forge snapshot --check --no-match-contract AetheronRetainerVaultInvariant

      - name: Lint
        run: npm run lint

      - name: Build web surface
        run: npm run build:web
