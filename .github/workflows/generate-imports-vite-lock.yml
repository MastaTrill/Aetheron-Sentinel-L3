name: Generate imports Vite lockfile

on:
  pull_request:
    branches: [main]
    paths:
      - 'imports/remix_-aetheron-sentinel-l3/package.json'
      - '.github/workflows/generate-imports-vite-lock.yml'

permissions:
  contents: write

jobs:
  lockfile:
    if: github.head_ref == 'codex/remediate-imports-vite'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Generate package lock
        working-directory: imports/remix_-aetheron-sentinel-l3
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- imports/remix_-aetheron-sentinel-l3/package-lock.json; then
            echo "Lockfile is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imports/remix_-aetheron-sentinel-l3/package-lock.json
          git commit -m "security: regenerate imports Vite lockfile"
          git push
