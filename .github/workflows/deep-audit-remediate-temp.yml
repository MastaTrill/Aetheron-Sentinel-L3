name: Deep audit remediation (temporary)

on:
  push:
    branches:
      - fix/deep-repo-audit-2026-09-02
    paths:
      - .github/workflows/deep-audit-remediate-temp.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/deep-repo-audit-2026-09-02
      - name: Fix cross-platform Python dependency resolution
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('requirements.txt')
          text = path.read_text(encoding='utf-8')

          old = 'pywin32==311\n'
          new = 'pywin32==311; platform_system == "Windows"\n'
          if old not in text:
              raise SystemExit('Expected pywin32 requirement not found')
          text = text.replace(old, new, 1)

          # Keep the explicit pinned Torch family later in the file and remove
          # the earlier unpinned duplicates, which make pip resolution impossible.
          for duplicate in ('torch\n', 'torchaudio\n', 'torchvision\n'):
              if text.count(duplicate) != 1:
                  raise SystemExit(f'Unexpected duplicate count for {duplicate.strip()}')
              text = text.replace(duplicate, '', 1)

          # Local `+cpu` build tags are not published on the default PyPI index.
          # Use portable public release pins; production Docker no longer needs
          # this workstation/ML stack once its dedicated API requirements land.
          replacements = {
              'torch==2.11.0+cpu\n': 'torch==2.11.0\n',
              'torchaudio==2.11.0+cpu\n': 'torchaudio==2.11.0\n',
              'torchvision==0.26.0+cpu\n': 'torchvision==0.26.0\n',
          }
          for old_pin, new_pin in replacements.items():
              if old_pin not in text:
                  raise SystemExit(f'Expected requirement not found: {old_pin.strip()}')
              text = text.replace(old_pin, new_pin, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove tracked deployer credential and fail closed without runtime key
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/monitor-and-deploy.mjs')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r"(const requiredWei = [^\n]+;[^\n]*\n)")
          guard = """\nconst deployerPrivateKey = (process.env.DEPLOYER_PRIVATE_KEY || '').trim();\nif (!/^0x[0-9a-fA-F]{64}$/.test(deployerPrivateKey)) {\n  console.error('DEPLOYER_PRIVATE_KEY must be supplied securely at runtime; refusing mainnet redeployment.');\n  process.exit(1);\n}\n"""
          if 'const deployerPrivateKey =' not in text:
              text, count = pattern.subn(r"\1" + guard, text, count=1)
              if count != 1:
                  raise SystemExit('Unable to insert deployer key guard')
          text, count = re.subn(
              r"DEPLOYER_PRIVATE_KEY:\s*'0x[0-9a-fA-F]{64}',",
              'DEPLOYER_PRIVATE_KEY: deployerPrivateKey,',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Expected hardcoded deployer key assignment not found')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Prove reproduced failures are addressed
        run: |
          node scripts/scan-tracked-secrets.mjs
          python -m pip install --dry-run -r requirements.txt >/tmp/pip-dry-run.log
      - name: Commit remediation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements.txt scripts/monitor-and-deploy.mjs
          git diff --cached --check
          git commit -m 'fix: secure deploy key and repair Python requirements'
          git push origin HEAD:fix/deep-repo-audit-2026-09-02
