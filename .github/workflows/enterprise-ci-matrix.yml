name: Concord Enterprise CI Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: enterprise-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Node ${{ matrix.node }} / Foundry ${{ matrix.foundry }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        foundry: [v1.7.1, nightly]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Setup Foundry ${{ matrix.foundry }}
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ matrix.foundry }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate release policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npm run security:release-scope

          if [[ -n "${RELEASE_TAG:-}" || -n "${RELEASE_COMMIT:-}" ]]; then
            if [[ -z "${RELEASE_TAG:-}" || -z "${RELEASE_COMMIT:-}" ]]; then
              echo 'RELEASE_TAG and RELEASE_COMMIT must be provided together.'
              exit 1
            fi
            npm run security:immutable-release
          else
            echo 'Skipping immutable published-release validation in generic PR/push CI.'
            echo 'The protected mainnet pipeline requires RELEASE_TAG and RELEASE_COMMIT and enforces this gate before deployment.'
          fi

      - name: Hardhat compile
        run: npm run compile

      - name: Foundry build
        run: forge build --sizes

      - name: Foundry tests
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: forge test -vvv

      - name: Release contract tests
        if: matrix.node == 24 && matrix.foundry == 'v1.7.1'
        run: npm run test:release

      - name: Enforce gas snapshot
        if: matrix.node == 24 && matrix.foundry == 'v1.7.1'
        run: forge snapshot --check --no-match-contract AetheronRetainerVaultInvariant

      - name: Lint
        if: matrix.node == 24 && matrix.foundry == 'v1.7.1'
        run: npm run lint

      - name: Build web surface
        if: matrix.node == 24 && matrix.foundry == 'v1.7.1'
        run: npm run build:web
