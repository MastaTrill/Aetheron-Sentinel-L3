name: Sentinel Release Closure

on:
  pull_request:
    paths:
      - 'docs/SENTINEL_*.md'
      - 'scripts/*sentinel*.mjs'
      - 'scripts/verify-sentinel-authority-reachability.sh'
      - 'release-evidence/sentinel-mainnet/release-closure.json'
      - 'release-evidence/sentinel-mainnet/redeployment-closure.json'
      - 'release-evidence/sentinel-mainnet/attestations/**'
      - 'release-evidence/sentinel-mainnet/smoke-test/**'
      - 'release-evidence/sentinel-mainnet/independent-review/**'
      - 'release-evidence/sentinel-mainnet/authority-reachability*'
      - 'release-evidence/sentinel-mainnet/swaps-decoded/**'
      - '.github/workflows/sentinel-release-closure.yml'
      - '.github/workflows/sentinel-final-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Syntax-check release scripts
        run: |
          node --check scripts/decode-sentinel-v4-swaps.mjs
          node --check scripts/verify-sentinel-smoke-test.mjs
          node --check scripts/verify-beneficiary-attestations.mjs
          node --check scripts/verify-sentinel-independent-signoff.mjs
          node --check scripts/validate-sentinel-release-closure.mjs
          node --check scripts/validate-sentinel-redeployment-closure.mjs
          bash -n scripts/verify-sentinel-authority-reachability.sh
      - name: Validate readiness manifest
        run: node scripts/validate-sentinel-redeployment-closure.mjs --mode=readiness
      - name: Verify preserved legacy evidence hashes
        run: |
          sha256sum -c release-evidence/sentinel-mainnet/authority-reachability.SHA256
          sha256sum -c release-evidence/sentinel-mainnet/swaps-decoded/SHA256SUMS
      - name: Validate preserved legacy swap directions and row count
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lines = readFileSync('release-evidence/sentinel-mainnet/swaps-decoded/transactions.csv', 'utf8').trim().split(/\r?\n/);
          const rows = lines.slice(1);
          const buys = rows.filter((line) => line.includes(',buy-sentinel-with-weth,')).length;
          const sells = rows.filter((line) => line.includes(',sell-sentinel-for-weth,')).length;
          if (rows.length !== 54) throw new Error(`Expected 54 swap rows, found ${rows.length}`);
          if (buys !== 2) throw new Error(`Expected 2 buy rows, found ${buys}`);
          if (sells !== 52) throw new Error(`Expected 52 sell rows, found ${sells}`);
          console.log({ rows: rows.length, buys, sells });
          NODE

  authority-reachability:
    name: Legacy authority reachability (manual evidence only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_RPC_URL: https://base-rpc.publicnode.com
      SENTINEL_SNAPSHOT_BLOCK: latest
    steps:
      - uses: actions/checkout@v6
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Simulate legacy authority paths without broadcasting
        run: |
          set -o pipefail
          mkdir -p release-evidence/sentinel-mainnet
          bash scripts/verify-sentinel-authority-reachability.sh \
            | tee /tmp/authority-reachability-current.txt
      - name: Upload current authority evidence
        uses: actions/upload-artifact@v6
        with:
          name: sentinel-legacy-authority-reachability-current
          path: /tmp/authority-reachability-current.txt
          if-no-files-found: error
          retention-days: 14

  decode-historical-swaps:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_RPC_URL: https://mainnet.base.org
      SENTINEL_SWAP_FROM_BLOCK: '42506026'
      SENTINEL_SWAP_TO_BLOCK: '49143598'
      SENTINEL_LOG_CHUNK: '9000'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Decode legacy pool swaps
        id: decode
        shell: bash
        run: |
          set +e
          node scripts/decode-sentinel-v4-swaps.mjs > swap-decoder.log 2>&1
          status=$?
          cat swap-decoder.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Require both trade directions
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const evidence = JSON.parse(readFileSync('release-evidence/sentinel-mainnet/swaps-decoded/swaps.json', 'utf8'));
          if (evidence.swapLogCount < 1) throw new Error('No legacy swaps decoded');
          if (evidence.buyCount < 1) throw new Error('No historical SENTINEL buy direction decoded');
          if (evidence.sellCount < 1) throw new Error('No historical SENTINEL sell direction decoded');
          console.log({ swapLogCount: evidence.swapLogCount, buyCount: evidence.buyCount, sellCount: evidence.sellCount });
          NODE
      - name: Hash decoded evidence
        run: sha256sum release-evidence/sentinel-mainnet/swaps-decoded/* | tee release-evidence/sentinel-mainnet/swaps-decoded/SHA256SUMS
      - name: Upload decoded evidence
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: sentinel-decoded-swap-routing
          path: release-evidence/sentinel-mainnet/swaps-decoded/
          if-no-files-found: error
          retention-days: 14
      - name: Upload decoder diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sentinel-swap-decoder-diagnostics
          path: |
            swap-decoder.log
            release-evidence/sentinel-mainnet/swaps-decoded/
          if-no-files-found: warn
          retention-days: 7
