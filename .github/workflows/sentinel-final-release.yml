name: Sentinel Final Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-final-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Syntax-check replacement validator
        run: node --check scripts/validate-sentinel-redeployment-closure.mjs
      - name: Validate replacement final release closure
        run: node scripts/validate-sentinel-redeployment-closure.mjs --mode=final
