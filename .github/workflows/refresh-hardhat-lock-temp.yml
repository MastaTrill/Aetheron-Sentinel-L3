name: Temporary Hardhat lock refresh

on:
  push:
    branches:
      - fix/deployment-truth-2026-09-02
    paths:
      - .github/workflows/refresh-hardhat-lock-temp.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/deployment-truth-2026-09-02
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Update Hardhat core pin
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.devDependencies.hardhat = '3.15.0';
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
      - name: Regenerate lockfile without package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Prove clean dependency resolution
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          test "$(node -p "require('hardhat/package.json').version")" = "3.15.0"
      - name: Commit deterministic dependency files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit.'
            exit 0
          fi
          git commit -m 'fix: align Hardhat plugin dependency graph'
          git push origin HEAD:fix/deployment-truth-2026-09-02
