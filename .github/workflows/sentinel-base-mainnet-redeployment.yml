name: SENTINEL Base Mainnet Controlled Redeployment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_SENTINEL_BASE_MAINNET to execute the signed controlled redeployment'
        required: true
        type: string
      release_commit:
        description: 'Exact reviewed and wallet-authorized 40-character commit'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sentinel-controlled-base-mainnet-redeployment
  cancel-in-progress: false

env:
  BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL }}
  DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
  SENTINEL_RELEASE_COMMIT: ${{ inputs.release_commit }}
  SENTINEL_REDEPLOYMENT_MANIFEST: release-evidence/sentinel-mainnet/redeployment/deployment-manifest.json
  SENTINEL_MAINNET_AUTHORIZATION: release-evidence/sentinel-mainnet/redeployment/mainnet-authorization.json
  SENTINEL_MAINNET_DEPLOYMENT_OUTPUT: /tmp/sentinel-redeployment/deployment-receipt.json

jobs:
  controlled-redeployment:
    name: Verify authorization and execute controlled Base Mainnet redeployment
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: base-mainnet
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require exact dispatch confirmation and authorized release commit
        shell: bash
        run: |
          set -euo pipefail
          test '${{ inputs.confirmation }}' = 'DEPLOY_SENTINEL_BASE_MAINNET'
          test '${{ inputs.release_commit }}' = '${{ github.sha }}'
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          test "${#SENTINEL_RELEASE_COMMIT}" -eq 40
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Syntax-check controlled redeployment executor
        run: node --check scripts/execute-sentinel-base-mainnet-redeployment.mjs
      - name: Validate frozen deployment manifest
        run: node scripts/validate-sentinel-deployment-manifest.mjs
      - name: Validate signed readiness evidence
        run: node scripts/validate-sentinel-redeployment-closure.mjs --mode=readiness
      - name: Execute signed controlled Base Mainnet redeployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sentinel-redeployment
          node scripts/execute-sentinel-base-mainnet-redeployment.mjs \
            | tee /tmp/sentinel-redeployment/execution.log
      - name: Upload immutable deployment evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sentinel-base-mainnet-redeployment-${{ github.run_id }}
          path: |
            /tmp/sentinel-redeployment/deployment-receipt.json
            /tmp/sentinel-redeployment/execution.log
          if-no-files-found: error
          retention-days: 90
