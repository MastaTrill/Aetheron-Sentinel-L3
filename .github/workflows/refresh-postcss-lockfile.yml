name: Refresh PostCSS lockfile

on:
  push:
    branches: [fix/sentinel-mainnet-live-state]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/sentinel-mainnet-live-state
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Regenerate lockfile without executing package scripts
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts
      - name: Commit deterministic lockfile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "fix(deps): pin patched PostCSS lockfile"
            git push origin HEAD:fix/sentinel-mainnet-live-state
          fi
