name: Temporary Tailwind lock refresh

on:
  push:
    branches:
      - fix/deployment-truth-2026-09-02
    paths:
      - .github/workflows/refresh-tailwind-lock-temp.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/deployment-truth-2026-09-02
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Add Tailwind build dependencies
        run: npm install --save-dev --package-lock-only --ignore-scripts --no-audit --no-fund tailwindcss@3.4.17 postcss@8.5.23 autoprefixer@10.4.21
      - name: Prove clean dependency resolution and web build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:web
      - name: Commit deterministic dependency files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit.'
            exit 0
          fi
          git commit -m 'fix: restore Tailwind web build dependencies'
          git push origin HEAD:fix/deployment-truth-2026-09-02
