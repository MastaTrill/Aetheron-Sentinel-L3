name: Sentinel Guardrails Base Sepolia Pipeline

on:
  workflow_dispatch:
    inputs:
      broadcast:
        description: 'Broadcast the reviewed, paused core release'
        required: true
        default: false
        type: boolean
      confirmation:
        description: 'Type DEPLOY_BASE_SEPOLIA to authorize broadcast'
        required: false
        type: string

permissions:
  contents: read
  deployments: read

concurrency:
  group: sentinel-guardrails-base-sepolia
  cancel-in-progress: false

env:
  RELEASE_PROFILE: sentinel-guardrails-v1
  DEPLOY_NETWORK: base-sepolia
  DEPLOY_ENVIRONMENT: base-sepolia
  BASE_TESTNET_RPC_URL: ${{ secrets.BASE_TESTNET_RPC_URL }}
  DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
  SENTINEL_OWNER: ${{ secrets.OWNER_ADDRESS }}
  MONITOR_ADDRESSES: ${{ secrets.MONITOR_ADDRESSES }}
  MIN_DEPLOYER_BALANCE_ETH: '0.05'
  RELEASE_COMMIT: ${{ github.sha }}
  DEPLOYMENT_MANIFEST_PATH: deployments/baseSepolia-sentinel-guardrails-v1.json

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: base-sepolia
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: npm ci --legacy-peer-deps
      - name: Require protected deployment environment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run security:deployment-environment
      - name: Validate frozen release scope
        run: npm run security:release-scope
      - name: Audit release and build dependencies
        run: |
          npm run security:audit
          npm run security:audit:toolchain
      - name: Compile exact deployment artifacts
        run: npm run compile
      - name: Run release regression tests
        run: npm run test:release
      - name: Run Foundry tests with aligned compiler settings
        run: |
          forge build --sizes
          forge test -vvv
      - name: Validate RPC, signer, owner, balance, and monitors
        shell: bash
        run: |
          set -euo pipefail
          npm run preflight:base-sepolia | tee base-sepolia-readiness.log
      - name: Simulate the exact deployment script
        run: npm run mainnet:simulate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base-sepolia-readiness-${{ github.run_id }}
          path: |
            base-sepolia-readiness.log
            /tmp/sentinel-guardrails-simulation.json
          if-no-files-found: error

  deploy:
    needs: readiness
    if: ${{ inputs.broadcast && inputs.confirmation == 'DEPLOY_BASE_SEPOLIA' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: base-sepolia
    env:
      DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
      BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run compile
      - name: Deploy the paused non-custodial core
        shell: bash
        run: |
          set -euo pipefail
          npm run deploy:base-sepolia | tee base-sepolia-deployment.log
      - name: Verify runtime bytecode, pause state, ownership, and roles
        run: npm run verify:release:base-sepolia
      - name: Verify source on BaseScan
        run: npm run verify:source:base-sepolia
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base-sepolia-deployment-${{ github.run_id }}
          path: |
            base-sepolia-deployment.log
            deployments/baseSepolia-sentinel-guardrails-v1.json
          if-no-files-found: error
