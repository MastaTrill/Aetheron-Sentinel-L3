name: Repair nanoid lock once

on:
  push:
    branches:
      - ci/nanoid-repair-251
    paths:
      - .github/workflows/repair-nanoid-once.yml

permissions:
  contents: write

jobs:
  repair-nanoid:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/nanoid-repair-251
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Pin patched nanoid and regenerate lockfile
        run: |
          npm pkg set 'overrides.nanoid=3.3.17'
          npm install --package-lock-only --legacy-peer-deps
      - name: Commit patched dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required"
          else
            git commit -m "chore: pin patched nanoid 3.3.17"
            git push origin HEAD:ci/nanoid-repair-251
          fi
      - name: Verify high-severity production audit
        run: npm audit --omit=dev --audit-level=high
