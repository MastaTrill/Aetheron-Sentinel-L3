name: Sentinel L3 Base Mainnet Pipeline

on:
  workflow_dispatch:

jobs:
  mainnet-deploy:
    runs-on: ubuntu-latest
    environment: base-mainnet
    concurrency:
      group: sentinel-l3-base-mainnet
      cancel-in-progress: false
    env:
      DEPLOY_NETWORK: base
      BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL }}
      OWNER_PRIVATE_KEY: ${{ secrets.OWNER_PRIVATE_KEY }}
      DEPLOYER_PRIVATE_KEY: ${{ secrets.OWNER_PRIVATE_KEY }}
      BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
      DEPLOY_TAG: sentinel-l3-v1
      OWNER_ADDRESS: ${{ secrets.OWNER_ADDRESS }}
      SENTINEL_OWNER: ${{ secrets.OWNER_ADDRESS }}
      RELAYER_ADDRESSES: ${{ secrets.RELAYER_ADDRESSES }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
          cache: npm
      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: '1.0.0'
      - name: Install dependencies
        run: npm ci
      - name: Preflight Base mainnet
        run: npm run mainnet:preflight
      - name: Build
        run: npm run mainnet:build
      - name: Test
        run: npm run mainnet:test
      - name: Simulate
        run: npm run mainnet:simulate
      - name: Deploy
        run: npm run deploy:base
      - name: Verify
        run: npm run verify:base
      - name: Patch
        run: npm run patch:base
      - name: Upload deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: deployments-base-mainnet
          path: deployments/base-mainnet.json
          if-no-files-found: error
