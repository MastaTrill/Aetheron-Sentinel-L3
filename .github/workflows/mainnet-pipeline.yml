name: Sentinel Base Mainnet Pipeline

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: 'Choose the isolated Base Mainnet deployment path'
        required: true
        default: guardrails
        type: choice
        options:
          - guardrails
          - sentinel-redeployment
      broadcast:
        description: 'Broadcast the selected reviewed release path'
        required: true
        default: false
        type: boolean
      confirmation:
        description: 'Exact target-specific deployment confirmation'
        required: false
        type: string
      release_commit:
        description: 'Exact reviewed 40-character commit to deploy'
        required: true
        type: string
      release_tag:
        description: 'Guardrails only: immutable GitHub release tag for release_commit'
        required: false
        type: string
      base_sepolia_run_id:
        description: 'Guardrails only: successful Base Sepolia broadcast workflow run'
        required: false
        type: string

permissions:
  actions: read
  contents: read
  deployments: read

concurrency:
  group: sentinel-base-mainnet
  cancel-in-progress: false

env:
  RELEASE_PROFILE: sentinel-guardrails-v1
  DEPLOY_NETWORK: base
  DEPLOY_ENVIRONMENT: base-mainnet
  MIN_DEPLOYER_BALANCE_ETH: '0.5'
  RELEASE_COMMIT: ${{ inputs.release_commit }}
  RELEASE_TAG: ${{ inputs.release_tag }}
  BASE_SEPOLIA_RUN_ID: ${{ inputs.base_sepolia_run_id }}
  DEPLOYMENT_MANIFEST_PATH: deployments/base-sentinel-guardrails-v1.json

jobs:
  readiness:
    if: ${{ inputs.deployment_target == 'guardrails' }}
    outputs:
      rehearsal_manifest_sha256: ${{ steps.rehearsal.outputs.manifest_sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: base-mainnet
    env:
      BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL }}
      DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
      SENTINEL_OWNER: ${{ secrets.OWNER_ADDRESS }}
      MONITOR_ADDRESSES: ${{ secrets.MONITOR_ADDRESSES }}
      AUDIT_REPORT_SHA256: ${{ secrets.AUDIT_REPORT_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Require the checked-out commit to equal the reviewed commit
        shell: bash
        run: |
          set -euo pipefail
          test "${RELEASE_COMMIT}" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Require Guardrails-only dispatch inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RELEASE_TAG}"
          test -n "${BASE_SEPOLIA_RUN_ID}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - run: npm ci --legacy-peer-deps
      - name: Require protected deployment environment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run security:deployment-environment
      - name: Require immutable release tag to pin the reviewed commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run security:immutable-release
      - name: Download exact Base Sepolia deployment artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: base-sepolia-deployment-${{ inputs.base_sepolia_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.base_sepolia_run_id }}
          path: /tmp/base-sepolia-rehearsal
      - name: Require exact successful Base Sepolia rehearsal artifact
        id: rehearsal
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SEPOLIA_MANIFEST_PATH: /tmp/base-sepolia-rehearsal/deployments/baseSepolia-sentinel-guardrails-v1-${{ inputs.base_sepolia_run_id }}.json
        run: npm run security:base-sepolia-rehearsal
      - name: Validate frozen release scope
        run: npm run security:release-scope
      - name: Audit release and build dependencies
        run: |
          npm run security:audit
          npm run security:audit:toolchain
      - name: Compile exact deployment artifacts
        run: npm run compile
      - name: Run release regression tests
        run: npm run test:release
      - name: Run Foundry tests with aligned compiler settings
        run: |
          forge build --sizes
          forge test -vvv
      - name: Validate RPC, signer, Safe, balance, audit, and monitors
        shell: bash
        run: |
          set -euo pipefail
          npm run mainnet:preflight | tee base-mainnet-readiness.log
      - name: Simulate the exact deployment script
        run: npm run mainnet:simulate
      - name: Collect readiness diagnostics when available
        if: always()
        shell: bash
        run: |
          mkdir -p base-mainnet-readiness-artifacts
          if test -f base-mainnet-readiness.log; then
            cp base-mainnet-readiness.log base-mainnet-readiness-artifacts/
          fi
          if test -f /tmp/sentinel-guardrails-simulation.json; then
            cp /tmp/sentinel-guardrails-simulation.json base-mainnet-readiness-artifacts/
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: base-mainnet-readiness-${{ github.run_id }}
          path: base-mainnet-readiness-artifacts/
          if-no-files-found: warn

  deploy:
    needs: readiness
    if: ${{ inputs.deployment_target == 'guardrails' && inputs.broadcast && inputs.confirmation == 'DEPLOY_BASE_MAINNET' && inputs.release_commit == github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: base-mainnet
    env:
      BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL }}
      DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
      SENTINEL_OWNER: ${{ secrets.OWNER_ADDRESS }}
      MONITOR_ADDRESSES: ${{ secrets.MONITOR_ADDRESSES }}
      BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
      AUDIT_REPORT_SHA256: ${{ secrets.AUDIT_REPORT_SHA256 }}
      BASE_SEPOLIA_MANIFEST_SHA256: ${{ needs.readiness.outputs.rehearsal_manifest_sha256 }}
      DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run compile
      - name: Deploy the paused non-custodial core
        shell: bash
        run: |
          set -euo pipefail
          npm run deploy:base | tee base-mainnet-deployment.log
      - name: Verify runtime bytecode, pause state, Safe ownership, and roles
        run: npm run verify:release:base
      - name: Verify source on BaseScan
        run: npm run verify:base
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: base-mainnet-deployment-${{ github.run_id }}
          path: |
            base-mainnet-deployment.log
            deployments/base-sentinel-guardrails-v1.json
          if-no-files-found: error

  sentinel_redeployment_readiness:
    if: ${{ inputs.deployment_target == 'sentinel-redeployment' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: base-mainnet
    env:
      SENTINEL_RELEASE_COMMIT: ${{ inputs.release_commit }}
      DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the checked-out commit to equal the authorized commit
        shell: bash
        run: |
          set -euo pipefail
          test "${SENTINEL_RELEASE_COMMIT}" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Validate exact controlled-redeployment manifest
        run: node scripts/validate-sentinel-deployment-manifest.mjs
      - name: Validate current redeployment readiness structure
        run: node scripts/validate-sentinel-redeployment-closure.mjs --mode=readiness
      - name: Validate protected SENTINEL deployment signer identity
        run: node scripts/validate-sentinel-mainnet-signer.mjs
      - name: Validate exact unexpired SENTINEL Mainnet authorization
        run: node scripts/validate-sentinel-mainnet-authorization.mjs

  sentinel_redeployment_deploy:
    needs: sentinel_redeployment_readiness
    if: ${{ inputs.deployment_target == 'sentinel-redeployment' && inputs.broadcast && inputs.confirmation == 'DEPLOY_SENTINEL_BASE_MAINNET' && inputs.release_commit == github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: base-mainnet
    env:
      BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL }}
      DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
      SENTINEL_RELEASE_COMMIT: ${{ inputs.release_commit }}
      SENTINEL_MAINNET_DEPLOYMENT_OUTPUT: ${{ github.workspace }}/sentinel-mainnet-deployment/deployment-receipt.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the checked-out commit to equal the authorized commit
        shell: bash
        run: |
          set -euo pipefail
          test "${SENTINEL_RELEASE_COMMIT}" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Revalidate exact unexpired SENTINEL Mainnet authorization
        run: node scripts/validate-sentinel-mainnet-authorization.mjs
      - name: Execute controlled SENTINEL Base Mainnet redeployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sentinel-mainnet-deployment
          node scripts/execute-sentinel-base-mainnet-redeployment.mjs | tee sentinel-mainnet-deployment/deployment.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: sentinel-mainnet-redeployment-${{ github.run_id }}
          path: |
            sentinel-mainnet-deployment/deployment.log
            sentinel-mainnet-deployment/deployment-receipt.json
          if-no-files-found: error
