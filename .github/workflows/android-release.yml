name: Android Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch: # Allow manual triggering

jobs:
  build:
    name: Build & Release Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build:mobile

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.PLAY_STORE_UPLOAD_KEY }}
        run: |
          echo $ENCODED_KEYSTORE | base64 --decode > android/app/upload-keystore.jks

      - name: Build Release AAB
        working-directory: ./android
        run: ./gradlew bundleRelease
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab

      # To enable automated Play Store upload, uncomment and configure the action below.
      # Note: The first upload must be done manually in the Google Play Console!
