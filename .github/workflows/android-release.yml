name: Android Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch: # Allow manual triggering

jobs:
  build:
    name: Build & Release Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Web App
        run: npm run build:mobile

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode Keystore (when configured)
        env:
          ENCODED_KEYSTORE: ${{ secrets.PLAY_STORE_UPLOAD_KEY }}
        run: |
          if [ -n "$ENCODED_KEYSTORE" ]; then
            printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
          else
            rm -f android/app/upload-keystore.jks
            echo "PLAY_STORE_UPLOAD_KEY secret not configured; building unsigned release AAB."
          fi

      - name: Build Release AAB
        working-directory: ./android
        run: chmod +x ./gradlew && ./gradlew bundleRelease
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab
