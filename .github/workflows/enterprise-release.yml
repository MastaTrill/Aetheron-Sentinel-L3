name: Concord Enterprise Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to release (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate-package-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run release governance gates
        run: |
          npm run security:release-scope
          npm run security:immutable-release
          npm run test:release

      - name: Build contract artifacts
        run: |
          npm run compile
          forge build --sizes

      - name: Package release artifacts
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          STAGE="release-package"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          for path in out artifacts config docs deploy; do
            if [[ -e "$path" ]]; then
              cp -R "$path" "$STAGE/"
            fi
          done

          cp package.json package-lock.json foundry.toml "$STAGE/"
          [[ -f remappings.txt ]] && cp remappings.txt "$STAGE/"
          [[ -f .gas-snapshot ]] && cp .gas-snapshot "$STAGE/"

          tar -czf "aetheron-sentinel-l3-${TAG}.tar.gz" "$STAGE"
          sha256sum "aetheron-sentinel-l3-${TAG}.tar.gz" > "aetheron-sentinel-l3-${TAG}.sha256"

      - name: Upload immutable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetheron-sentinel-l3-${{ steps.release.outputs.tag }}
          path: |
            aetheron-sentinel-l3-${{ steps.release.outputs.tag }}.tar.gz
            aetheron-sentinel-l3-${{ steps.release.outputs.tag }}.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading artifacts only."
            gh release upload "$TAG" \
              "aetheron-sentinel-l3-${TAG}.tar.gz" \
              "aetheron-sentinel-l3-${TAG}.sha256" \
              --clobber
          else
            gh release create "$TAG" \
              "aetheron-sentinel-l3-${TAG}.tar.gz" \
              "aetheron-sentinel-l3-${TAG}.sha256" \
              --verify-tag \
              --generate-notes \
              --title "Aetheron Sentinel L3 $TAG"
          fi
