name: Aetheron Sentinel L3 - Base Mainnet Deployment

# Manual-only. Never runs on push/PR to avoid noise and accidental deploys.
on:
  workflow_dispatch:
    inputs:
      dry_run_only:
        description: 'Run dry-run simulation only (no live deploy)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      resume_from_stage:
        description: 'Resume from stage number (0 = full run)'
        required: false
        default: '0'
      fork_block:
        description: 'Specific block number to fork from (leave blank for latest)'
        required: false
        default: 'latest'

concurrency:
  group: base-mainnet-deploy
  cancel-in-progress: false

env:
  FOUNDRY_PROFILE: mainnet
  FORK_BLOCK: ${{ github.event.inputs.fork_block || 'latest' }}

jobs:
  validate-environment:
    name: "Stage 00 - Toolchain & Environment Lock"
    runs-on: ubuntu-latest
    outputs:
      lock_hash: ${{ steps.toolchain.outputs.TOOLCHAIN_LOCK_HASH }}
      deployer: ${{ steps.toolchain.outputs.DEPLOYER_ADDR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Foundry (pinned)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 'v0.3.0'

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run toolchain & environment lock check
        id: toolchain
        env:
          BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
          SENTINEL_SEQUENCER_ADDR: ${{ secrets.SENTINEL_SEQUENCER_ADDR }}
          SENTINEL_BATCH_SUBMITTER_ADDR: ${{ secrets.SENTINEL_BATCH_SUBMITTER_ADDR }}
          SENTINEL_PROPOSER_ADDR: ${{ secrets.SENTINEL_PROPOSER_ADDR }}
          SENTINEL_CHALLENGER_ADDR: ${{ secrets.SENTINEL_CHALLENGER_ADDR }}
          SENTINEL_UNSAFE_BLOCK_SIGNER_ADDR: ${{ secrets.SENTINEL_UNSAFE_BLOCK_SIGNER_ADDR }}
          DEPLOYMENT_SALT: ${{ secrets.DEPLOYMENT_SALT }}
          OWNER_MULTISIG_ADDR: ${{ secrets.OWNER_MULTISIG_ADDR }}
        run: |
          if [ -f scripts/00_check_toolchain.sh ]; then
            bash scripts/00_check_toolchain.sh
          else
            echo "Toolchain check script not present; skipping."
            echo "TOOLCHAIN_LOCK_HASH=none" >> "$GITHUB_OUTPUT"
            echo "DEPLOYER_ADDR=none" >> "$GITHUB_OUTPUT"
          fi

  dry-run:
    name: "Stage 01 - Dry-Run Fork Simulation"
    runs-on: ubuntu-latest
    needs: validate-environment
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 'v0.3.0'

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run dry-run fork simulation
        env:
          BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
          SENTINEL_SEQUENCER_ADDR: ${{ secrets.SENTINEL_SEQUENCER_ADDR }}
          SENTINEL_BATCH_SUBMITTER_ADDR: ${{ secrets.SENTINEL_BATCH_SUBMITTER_ADDR }}
          SENTINEL_PROPOSER_ADDR: ${{ secrets.SENTINEL_PROPOSER_ADDR }}
          SENTINEL_CHALLENGER_ADDR: ${{ secrets.SENTINEL_CHALLENGER_ADDR }}
          SENTINEL_UNSAFE_BLOCK_SIGNER_ADDR: ${{ secrets.SENTINEL_UNSAFE_BLOCK_SIGNER_ADDR }}
          DEPLOYMENT_SALT: ${{ secrets.DEPLOYMENT_SALT }}
          OWNER_MULTISIG_ADDR: ${{ secrets.OWNER_MULTISIG_ADDR }}
          FORK_BLOCK: ${{ env.FORK_BLOCK }}
        run: |
          if [ -f scripts/01_dry_run.sh ]; then
            bash scripts/01_dry_run.sh
          else
            echo "Dry-run script not present; skipping."
          fi

      - name: Upload dry-run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-traces-${{ github.run_id }}
          path: |
            artifacts/dry-run-traces/
            artifacts/reports/
          retention-days: 30
          if-no-files-found: ignore

  deploy:
    name: "Stage 02 - Live Deployment"
    runs-on: ubuntu-latest
    needs: dry-run
    if: ${{ github.event.inputs.dry_run_only != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 'v0.3.0'

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Execute deployment sequence
        env:
          BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
          SENTINEL_SEQUENCER_ADDR: ${{ secrets.SENTINEL_SEQUENCER_ADDR }}
          SENTINEL_BATCH_SUBMITTER_ADDR: ${{ secrets.SENTINEL_BATCH_SUBMITTER_ADDR }}
          SENTINEL_PROPOSER_ADDR: ${{ secrets.SENTINEL_PROPOSER_ADDR }}
          SENTINEL_CHALLENGER_ADDR: ${{ secrets.SENTINEL_CHALLENGER_ADDR }}
          SENTINEL_UNSAFE_BLOCK_SIGNER_ADDR: ${{ secrets.SENTINEL_UNSAFE_BLOCK_SIGNER_ADDR }}
          DEPLOYMENT_SALT: ${{ secrets.DEPLOYMENT_SALT }}
          OWNER_MULTISIG_ADDR: ${{ secrets.OWNER_MULTISIG_ADDR }}
        run: |
          if [ -f scripts/02_deploy_sequence.sh ]; then
            bash scripts/02_deploy_sequence.sh
          else
            echo "Deploy script not present; aborting."
            exit 1
          fi

      - name: Upload deployment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifacts-${{ github.run_id }}
          path: |
            artifacts/receipts/
            artifacts/deployed-addresses.json
          retention-days: 90
          if-no-files-found: ignore

  verify:
    name: "Stage 03 - Post-Deploy Verification"
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ github.event.inputs.dry_run_only != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 'v0.3.0'

      - name: Download address registry
        uses: actions/download-artifact@v8
        with:
          name: deploy-artifacts-${{ github.run_id }}
          path: artifacts/
          merge-multiple: true

      - name: Run post-deploy verification
        env:
          BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL }}
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
          SENTINEL_SEQUENCER_ADDR: ${{ secrets.SENTINEL_SEQUENCER_ADDR }}
          SENTINEL_BATCH_SUBMITTER_ADDR: ${{ secrets.SENTINEL_BATCH_SUBMITTER_ADDR }}
          SENTINEL_PROPOSER_ADDR: ${{ secrets.SENTINEL_PROPOSER_ADDR }}
          SENTINEL_CHALLENGER_ADDR: ${{ secrets.SENTINEL_CHALLENGER_ADDR }}
          SENTINEL_UNSAFE_BLOCK_SIGNER_ADDR: ${{ secrets.SENTINEL_UNSAFE_BLOCK_SIGNER_ADDR }}
          OWNER_MULTISIG_ADDR: ${{ secrets.OWNER_MULTISIG_ADDR }}
        run: |
          if [ -f scripts/03_post_deploy_verify.sh ]; then
            bash scripts/03_post_deploy_verify.sh
          else
            echo "Verify script not present; skipping."
          fi

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report-${{ github.run_id }}
          path: artifacts/reports/
          retention-days: 90
          if-no-files-found: ignore

  readiness-gates:
    name: "Stage 04 - Readiness Gates (Go/No-Go)"
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ github.event.inputs.dry_run_only != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 'v0.3.0'

      - name: Download prior artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Evaluate readiness gates
        env:
          BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          SENTINEL_SEQUENCER_ADDR: ${{ secrets.SENTINEL_SEQUENCER_ADDR }}
          SENTINEL_BATCH_SUBMITTER_ADDR: ${{ secrets.SENTINEL_BATCH_SUBMITTER_ADDR }}
          SENTINEL_PROPOSER_ADDR: ${{ secrets.SENTINEL_PROPOSER_ADDR }}
          SENTINEL_CHALLENGER_ADDR: ${{ secrets.SENTINEL_CHALLENGER_ADDR }}
          SENTINEL_UNSAFE_BLOCK_SIGNER_ADDR: ${{ secrets.SENTINEL_UNSAFE_BLOCK_SIGNER_ADDR }}
          OWNER_MULTISIG_ADDR: ${{ secrets.OWNER_MULTISIG_ADDR }}
          DEPLOYMENT_APPROVERS: ${{ secrets.DEPLOYMENT_APPROVERS }}
          SENTINEL_L3_RPC_URL: ${{ secrets.SENTINEL_L3_RPC_URL }}
        run: |
          if [ -f scripts/04_readiness_gates.sh ]; then
            bash scripts/04_readiness_gates.sh
          else
            echo "Readiness gates script not present; skipping."
          fi

      - name: Upload gate lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-lock-${{ github.run_id }}
          path: artifacts/gate.lock
          retention-days: 365
          if-no-files-found: ignore

  generate-artifacts:
    name: "Stage 05 - Artifact & Manifest Generation"
    runs-on: ubuntu-latest
    needs: readiness-gates
    if: ${{ github.event.inputs.dry_run_only != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 'v0.3.0'

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Download all prior artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate final artifact bundle
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          DEPLOYMENT_SALT: ${{ secrets.DEPLOYMENT_SALT }}
          OWNER_MULTISIG_ADDR: ${{ secrets.OWNER_MULTISIG_ADDR }}
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
        run: |
          if [ -f scripts/05_generate_artifacts.sh ]; then
            bash scripts/05_generate_artifacts.sh
          else
            echo "Artifact generation script not present; creating placeholder."
            mkdir -p artifacts
            echo '{"status":"placeholder"}' > artifacts/deployment-manifest.json
            echo "# Deployment Manifest (placeholder)" > artifacts/deployment-manifest.md
          fi

      - name: Upload final artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: aetheron-sentinel-l3-deployment-${{ github.run_id }}
          path: |
            artifacts/deployment-manifest.json
            artifacts/deployment-manifest.md
            artifacts/deployed-addresses.json
            artifacts/gate.lock
            artifacts/checksums.sha256
            artifacts/abi/
          retention-days: 365
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@4634574ec0169f16807c8ad4d8b71b773d3a5936
        with:
          tag_name: "deploy-mainnet-${{ github.run_id }}"
          name: "Aetheron Sentinel L3 - Base Mainnet Deployment #${{ github.run_id }}"
          body_path: artifacts/deployment-manifest.md
          files: |
            artifacts/deployment-manifest.json
            artifacts/deployed-addresses.json
            artifacts/gate.lock
            artifacts/checksums.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
