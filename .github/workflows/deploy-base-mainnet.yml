name: Aetheron Sentinel L3 - Base Mainnet Deployment
# =============================================================================
# FIXES APPLIED:
#   BUG-30  Job outputs wrote to $GITHUB_ENV instead of $GITHUB_OUTPUT --
#           declared job outputs (lock_hash, deployer) were always empty.
#           Fixed: script now writes to GITHUB_OUTPUT; workflow reads with
#           steps.<id>.outputs.<name> syntax.
#   BUG-31  dry-run job condition removed -- dry-run always runs by design.
#   BUG-32  dry-run job missing sequencer/challenger/multisig env vars fixed.
#   BUG-33  readiness-gates job missing SENTINEL_L3_RPC_URL fixed.
#   BUG-34  softprops/action-gh-release@v2 pinned to commit SHA.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      dry_run_only:
        description: 'Run dry-run simulation only (no live deploy)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      resume_from_stage:
        description: 'Resume from stage number (0 = full run)'
        required: false
        default: '0'
      fork_block:
        description: 'Specific block number to fork from (leave blank for latest)'
        required: false
        default: 'latest'

concurrency:
  group: base-mainnet-deploy
  cancel-in-progress: false

env:
  FOUNDRY_PROFILE: mainnet
  FORK_BLOCK: ${{ github.event.inputs.fork_block || 'latest' }}

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 -- Toolchain & environment lock
  # ---------------------------------------------------------------------------
  validate-environment:      runs-on: ubuntu-latest
      outputs:
        # BUG-30 FIX: read from steps outputs, not env.
        lock_hash: ${{ steps.toolchain.outputs.TOOLCHAIN_LOCK_HASH }}
        deployer:  ${{ steps.toolchain.outputs.DEPLOYER_ADDR }}
      steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            submodules: recursive
            fetch-depth: 0

        - name: Install Foundry (pinned to v0.3.0)
          uses: foundry-rs/foundry-toolchain@v1
          with:
            version: 'v0.3.0'

        - name: Install Node (pinned to 20.18.2)
          uses: actions/setup-node@v4
          with:
            node-version: '20.18.2'
            cache: 'npm'

        - name: Install npm dependencies
          run: npm ci

        - name: Run toolchain & environment lock check
          id: toolchain
          env:
            BASE_MAINNET_RPC_URL:              ${{ secrets.BASE_MAINNET_RPC_URL }}
            DEPLOYER_PRIVATE_KEY:              ${{ secrets.DEPLOYER_PRIVATE_KEY }}
            BASESCAN_API_KEY:                  ${{ secrets.BASESCAN_API_KEY }}
            SENTINEL_SEQUENCER_ADDR:           ${{ secrets.SENTINEL_SEQUENCER_ADDR }}
            SENTINEL_BATCH_SUBMITTER_ADDR:     ${{ secrets.SENTINEL_BATCH_SUBMITTER_ADDR }}
            SENTINEL_PROPOSER_ADDR:            ${{ secrets.SENTINEL_PROPOSER_ADDR }}
            SENTINEL_CHALLENGER_ADDR:          ${{ secrets.SENTINEL_CHALLENGER_ADDR }}
            SENTINEL_UNSAFE_BLOCK_SIGNER_ADDR: ${{ secrets.SENTINEL_UNSAFE_BLOCK_SIGNER_ADDR }}
            DEPLOYMENT_SALT:                   ${{ secrets.DEPLOYMENT_SALT }}
            OWNER_MULTISIG_ADDR:               ${{ secrets.OWNER_MULTISIG_ADDR }}
          run: bash scripts/00_check_toolchain.sh

  # ---------------------------------------------------------------------------
  # JOB 2 -- Dry-run fork simulation (unconditional by design)
  # ---------------------------------------------
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 'v0.3.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: 'npm'

      - run: npm ci

      - name: Run dry-run fork simulation
        env:
          # BUG-32 FIX: include ALL 10 required env vars
          BASE_MAINNET_RPC_URL:              ${{ secrets.BASE_MAINNET_RPC_URL }}
          DEPLOYER_PRIVATE_KEY:              ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BASESCAN_API_KEY:                  ${{ secrets.BASESCAN_API_KEY }}
          SENTINEL_SEQUENCER_ADDR:           ${{ secrets.SENTINEL_SEQUENCER_ADDR }}
          SENTINEL_BATCH_SUBMITTER_ADDR:     ${{ secrets.SENTINEL_BATCH_SUBMITTER_ADDR }}
          SENTINEL_PROPOSER_ADDR:            ${{ secrets.SENTINEL_PROPOSER_ADDR }}
          SENTINEL_CHALLENGER_ADDR:          ${{ secrets.SENTINEL_CHALLENGER_ADDR }}
          SENTINEL_UNSAFE_BLOCK_SIGNER_ADDR: ${{ secrets.SENTINEL_UNSAFE_BLOCK_SIGNER_ADDR }}
          DEPLOYMENT_SALT:                   ${{ secrets.DEPLOYMENT_SALT }}
          OWNER_MULTISIG_ADDR:               ${{ secrets.OWNER_MULTISIG_ADDR }}
          FORK_BLOCK:                        ${{ env.FORK_BLOCK }}
        run: bash scripts/01_dry_run.sh

      - name: Upload dry-run traces
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-traces-${{ github.run_id }}
          path: artifacts/dry-run-traces/
          retention-days: 30

      - name: Upload gas report
        uses: actions/upload-artifact@v4
        with:
          name: gas-estimate-${{ github.run_id }}
          path: artifacts/reports/gas-estimate.md
          retention-days: 30

  # ---------------------------------------------------------------------------
  # JOB 3 -- Live deployment (skipped when dry_run_only == 'true')
  # ---------------------------------------------------------------------------
  deploy:          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 'v0.3.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: 'npm'

      - run: npm ci

      - name: Execute deployment sequence
        env:
          BASE_MAINNET_RPC_URL:              ${{ secrets.BASE_MAINNET_RPC_URL }}
          DEPLOYER_PRIVATE_KEY:              ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BASESCAN_API_KEY:                  ${{ secrets.BASESCAN_API_KEY }}
          SENTINEL_SEQUENCER_ADDR:           ${{ secrets.SENTINEL_SEQUENCER_ADDR }}
          SENTINEL_BATCH_SUBMITTER_ADDR:     ${{ secrets.SENTINEL_BATCH_SUBMITTER_ADDR }}
          SENTINEL_PROPOSER_ADDR:            ${{ secrets.SENTINEL_PROPOSER_ADDR }}
          SENTINEL_CHALLENGER_ADDR:          ${{ secrets.SENTINEL_CHALLENGER_ADDR }}
          SENTINEL_UNSAFE_BLOCK_SIGNER_ADDR: ${{ secrets.SENTINEL_UNSAFE_BLOCK_SIGNER_ADDR }}
          DEPLOYMENT_SALT:                   ${{ secrets.DEPLOYMENT_SALT }}
          OWNER_MULTISIG_ADDR:               ${{ secrets.OWNER_MULTISIG_ADDR }}
        run: bash scripts/02_deploy_sequence.sh

      - name: Upload deployment receipts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-receipts-${{ github.run_id }}
          path: artifacts/receipts/
          retention-days: 90

      - name: Upload address registry
        uses: actions/upload-artifact@v4
        with:
          name: deployed-addresses-${{ github.run_id }}
          path: artifacts/deployed-addresses.json
          retention-days: 90

  # ---------------------------------------------------------------------------
  # JOB 4 -- Post-deploy verification
  # ---------------------------------------------------------------------------
  verify:
    name: "Stage 03 - Post-Deploy Verification"
    runs-on: ubuntu-latest          version: 'v0.3.0'

      - name: Download address registry
        uses: actions/download-artifact@v4
        with:
          name: deployed-addresses-${{ github.run_id }}
          path: artifacts/

      - name: Run post-deploy verification
        env:
          BASE_MAINNET_RPC_URL:              ${{ secrets.BASE_MAINNET_RPC_URL }}
          BASESCAN_API_KEY:                  ${{ secrets.BASESCAN_API_KEY }}
          SENTINEL_SEQUENCER_ADDR:           ${{ secrets.SENTINEL_SEQUENCER_ADDR }}
          SENTINEL_BATCH_SUBMITTER_ADDR:     ${{ secrets.SENTINEL_BATCH_SUBMITTER_ADDR }}
          SENTINEL_PROPOSER_ADDR:            ${{ secrets.SENTINEL_PROPOSER_ADDR }}
          SENTINEL_CHALLENGER_ADDR:          ${{ secrets.SENTINEL_CHALLENGER_ADDR }}
          SENTINEL_UNSAFE_BLOCK_SIGNER_ADDR: ${{ secrets.SENTINEL_UNSAFE_BLOCK_SIGNER_ADDR }}
          OWNER_MULTISIG_ADDR:               ${{ secrets.OWNER_MULTISIG_ADDR }}
        run: bash scripts/03_post_deploy_verify.sh

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: verification-report-${{ github.run_id }}
          path: artifacts/reports/post-deploy-verification.json
          retention-days: 90

  # ---------------------------------------------------------------------------
  # JOB 5 -- Readiness gates
  # ---------------------------------------------------------------------------
  readiness-gates:
    name: "Stage 04 - Readiness Gates (Go/No-Go)"
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 'v0.3.0'

      - name: Download address registry
        uses: actions/download-artifact@v4
        with:          SENTINEL_BATCH_SUBMITTER_ADDR:     ${{ secrets.SENTINEL_BATCH_SUBMITTER_ADDR }}
          SENTINEL_PROPOSER_ADDR:            ${{ secrets.SENTINEL_PROPOSER_ADDR }}
          SENTINEL_CHALLENGER_ADDR:          ${{ secrets.SENTINEL_CHALLENGER_ADDR }}
          SENTINEL_UNSAFE_BLOCK_SIGNER_ADDR: ${{ secrets.SENTINEL_UNSAFE_BLOCK_SIGNER_ADDR }}
          OWNER_MULTISIG_ADDR:               ${{ secrets.OWNER_MULTISIG_ADDR }}
          DEPLOYMENT_APPROVERS:              ${{ secrets.DEPLOYMENT_APPROVERS }}
          # BUG-33 FIX: SENTINEL_L3_RPC_URL was missing -- Gate 2 was always skipped
          SENTINEL_L3_RPC_URL:               ${{ secrets.SENTINEL_L3_RPC_URL }}
        run: bash scripts/04_readiness_gates.sh

      - name: Upload gate lock
        uses: actions/upload-artifact@v4
        with:
          name: gate-lock-${{ github.run_id }}
          path: artifacts/gate.lock
          retention-days: 365

  # ---------------------------------------------------------------------------
  # JOB 6 -- Artifact generation & GitHub Release
  # ---------------------------------------------------------------------------
  generate-artifacts:
    name: "Stage 05 - Artifact & Manifest Generation"
    runs-on: ubuntu-latest
    needs: readiness-gates
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 'v0.3.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: 'npm'

      - run: npm ci

      - name: Download all prior artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Upload final artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: aetheron-sentinel-l3-deployment-${{ github.run_id }}
          path: |
            artifacts/deployment-manifest.json
            artifacts/deployment-manifest.md
            artifacts/deployed-addresses.json
            artifacts/gate.lock
            artifacts/checksums.sha256
            artifacts/abi/
          retention-days: 365

      - name: Create GitHub Release
        if: success()
        # BUG-34 FIX: pin action to specific commit SHA for deterministic resolution
        uses: softprops/action-gh-release@4634574ec0169f16807c8ad4d8b71b773d3a5936
        with:
          tag_name:  "deploy-mainnet-${{ github.run_id }}"
          name:      "Aetheron Sentinel L3 - Base Mainnet Deployment #${{ github.run_id }}"
          body_path: artifacts/deployment-manifest.md
          files: |
            artifacts/deployment-manifest.json
            artifacts/deployed-addresses.json
            artifacts/gate.lock
            artifacts/checksums.sha256
          draft:      false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate final artifact bundle
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          DEPLOYMENT_SALT:      ${{ secrets.DEPLOYMENT_SALT }}
          OWNER_MULTISIG_ADDR:  ${{ secrets.OWNER_MULTISIG_ADDR }}
          BASESCAN_API_KEY:     ${{ secrets.BASESCAN_API_KEY }}
        run: bash scripts/05_generate_artifacts.sh


          name: deployed-addresses-${{ github.run_id }}
          path: artifacts/

      - name: Evaluate readiness gates
        env:
          BASE_MAINNET_RPC_URL:              ${{ secrets.BASE_MAINNET_RPC_URL }}
          DEPLOYER_PRIVATE_KEY:              ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          SENTINEL_SEQUENCER_ADDR:           ${{ secrets.SENTINEL_SEQUENCER_ADDR }}

    needs: deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:

    name: "Stage 02 - Live Deployment Sequencer"
    runs-on: ubuntu-latest
    needs: dry-run
    if: github.event.inputs.dry_run_only == 'false'
    environment: base-mainnet-production
    steps:
      - uses: actions/checkout@v4
        with:
------------------------------
  dry-run:
    name: "Stage 01 - Dry-Run Fork Simulation"
    runs-on: ubuntu-latest
    needs: validate-environment
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

    name: "Stage 00 - Toolchain & Environment Lock"
    runs-on: ubuntu-latest
    environment: base-mainnet-production
    outputs:
      lock_hash: ${{ steps.lock.outputs.lock_hash }}
      deployer: ${{ steps.lock.outputs.deployer }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
