name: Aetheron Sentinel L3 CI (Memory Optimized)

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        # Global Environment Throttles
        env:
            # 1. Node.js/V8 Limits: Caps heap at ~6GB, forces garbage collection
            NODE_OPTIONS: "--max-old-space-size=6144"

            # 2. Rust/Cargo Limits: Single-threaded build, minimal codegen parallelization
            CARGO_BUILD_JOBS: 1
            RUSTFLAGS: "-C codegen-units=1"

            # 3. Go Limits: Single OS thread, aggressive garbage collection
            GOMAXPROCS: 1
            GOGC: 50

        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
              with:
                  submodules: recursive

            - name: Initialize submodules
              run: git submodule update --init --recursive

            - name: Allocate Virtual Swap Space (4GB)
              run: |
                  echo "Current memory before swap:"
                  free -h
                  if [ -e /swapfile ]; then
                    sudo swapoff /swapfile || true
                    sudo rm -f /swapfile
                  fi
                  sudo fallocate -l 4G /swapfile
                  sudo chmod 600 /swapfile
                  sudo mkswap /swapfile
                  sudo swapon /swapfile
                  sudo sysctl vm.swappiness=10
                  echo "Memory allocated after swap:"
                  free -h

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Cache Hardhat compiler and artifacts
              uses: actions/cache@v6
              with:
                  path: |
                      cache
                      artifacts
                  key: ${{ runner.os }}-hardhat-${{ hashFiles('contracts/**/*.sol') }}
                  restore-keys: |
                      ${{ runner.os }}-hardhat-

            - name: Install Dependencies
              run: npm ci --legacy-peer-deps --prefer-offline --no-audit

            - name: Execute Build Pipeline
              # Your specific build commands go here.
              # The environment variables above will automatically throttle them.
              run: npm run compile

    test:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: recursive
            - name: Initialize submodules
              run: git submodule update --init --recursive
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "22"
                  cache: "npm"
            - name: Install Dependencies
              run: npm ci --legacy-peer-deps --prefer-offline --no-audit
            - name: Run Tests
              run: node scripts/run-hardhat-tests.cjs

    lint:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: recursive
            - name: Initialize submodules
              run: git submodule update --init --recursive
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "22"
                  cache: "npm"
            - name: Install Dependencies
              run: npm ci --legacy-peer-deps --prefer-offline --no-audit
            - name: Run ESLint
              run: npm run lint
            - name: Check release-critical formatting
              run: npm run format:check:release

    security-audit:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: recursive
            - name: Initialize submodules
              run: git submodule update --init --recursive
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "22"
                  cache: "npm"
            - name: Install Dependencies
              run: npm ci --legacy-peer-deps --prefer-offline --no-audit
            - name: Run npm audit
              run: |
                  npm run security:audit
                  npm run security:audit:toolchain

    slither-analysis:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: recursive
            - name: Initialize submodules
              run: git submodule update --init --recursive
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "22" # Consistent Node.js version
                  cache: npm
            - uses: foundry-rs/foundry-toolchain@v1
              with:
                  version: v1.7.1
            - name: Install dependencies
              run: npm ci --legacy-peer-deps --prefer-offline --no-audit
            - name: Verify precompiled artifacts are present or build
              run: test -d artifacts/contracts || npm run compile # Ensure artifacts exist, or build them
            - name: Install Slither
              run: |
                  sudo apt-get update && sudo apt-get install -y python3-pip
                  pip3 install slither-analyzer
            - name: Validate release scope
              run: npm run security:release-scope
            - name: Run fail-closed Slither on the release scope
              run: |
                  for contract in SentinelInterceptor CircuitBreaker RateLimiter; do
                    slither "contracts/${contract}.sol" --config-file slither.config.json --fail-high
                  done

    ci-success:
        runs-on: ubuntu-latest
        if: always()
        needs:
            - build
            - test
            - lint
            - security-audit
            - slither-analysis
        steps:
            - name: Decide whether the needed jobs succeeded or failed
              uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # Use a specific version for stability
              with:
                  jobs: ${{ toJSON(needs) }}
