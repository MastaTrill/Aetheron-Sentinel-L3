name: Aetheron Sentinel L3 CI (Memory Optimized)

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        # Global Environment Throttles
        env:
            # 1. Node.js/V8 Limits: Caps heap at ~6GB, forces garbage collection
            NODE_OPTIONS: "--max-old-space-size=6144 --optimize-for-size --gc-interval=100"

            # 2. Rust/Cargo Limits: Single-threaded build, minimal codegen parallelization
            CARGO_BUILD_JOBS: 1
            RUSTFLAGS: "-C codegen-units=1"

            # 3. Go Limits: Single OS thread, aggressive garbage collection
            GOMAXPROCS: 1
            GOGC: 50

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Allocate Virtual Swap Space (4GB)
              run: |
                  echo "Current memory before swap:"
                  free -h
                  sudo fallocate -l 4G /swapfile
                  sudo chmod 600 /swapfile
                  sudo mkswap /swapfile
                  sudo swapon /swapfile
                  sudo sysctl vm.swappiness=10
                  echo "Memory allocated after swap:"
                  free -h

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Cache Hardhat compiler and artifacts
              uses: actions/cache@v4
              with:
                  path: |
                      cache
                      artifacts
                  key: ${{ runner.os }}-hardhat-${{ hashFiles('contracts/**/*.sol') }}
                  restore-keys: |
                      ${{ runner.os }}-hardhat-

            - name: Install Dependencies
              run: npm ci --prefer-offline --no-audit

            - name: Execute Build Pipeline
              # Your specific build commands go here.
              # The environment variables above will automatically throttle them.
              run: npm run compile

    test:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
            - name: Install Dependencies
              run: npm ci --prefer-offline --no-audit
            - name: Run Tests
              run: npm run test # Assuming 'npm run test' script exists

    lint:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
            - name: Install Dependencies
              run: npm ci --prefer-offline --no-audit
            - name: Run ESLint
              run: npm run lint # Assuming 'npm run lint' script exists
            - name: Run Prettier Check
              run: npm run format:check # Assuming 'npm run format:check' script exists

    security-audit:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
            - name: Install Dependencies
              run: npm ci --prefer-offline --no-audit
            - name: Run npm audit
              run: npm audit --audit-level=high # Configure audit level as appropriate

    slither-analysis:
        needs: build
        runs-on: ubuntu-latest
        env:
            ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        steps:
            - uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20" # Consistent Node.js version
                  cache: npm
            - name: Install dependencies
              run: npm ci --prefer-offline --no-audit
            - name: Verify precompiled artifacts are present or build
              run: test -d artifacts/contracts || npm run compile # Ensure artifacts exist, or build them
            - name: Install Slither
              run: |
                  sudo apt-get update && sudo apt-get install -y python3-pip
                  pip3 install slither-analyzer
            - name: Run Slither
              run: slither ./contracts --filter-paths 'node_modules|test|scripts' || true # Allow failure for now

    ci-success:
        runs-on: ubuntu-latest
        if: always()
        needs:
            - build
            - test
            - lint
            - security-audit
            - slither-analysis
        steps:
            - name: Decide whether the needed jobs succeeded or failed
              uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # Use a specific version for stability
              with:
                  jobs: ${{ toJSON(needs) }}
