name: Deploy Dashboard to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard/**'
      - 'apps/remix-dashboard/**'
      - '.github/workflows/deploy-dashboard-vercel.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    # Skip automatically when required secrets are missing (avoids red X on every push)
    if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect dashboard root
        id: root
        run: |
          if [ -d dashboard ]; then
            echo "cwd=./dashboard" >> "$GITHUB_OUTPUT"
          elif [ -d apps/remix-dashboard ]; then
            echo "cwd=./apps/remix-dashboard" >> "$GITHUB_OUTPUT"
          else
            echo "No dashboard directory found; skipping deploy."
            echo "cwd=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        if: steps.root.outputs.cwd != ''
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        if: steps.root.outputs.cwd != ''
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} --cwd=${{ steps.root.outputs.cwd }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        if: steps.root.outputs.cwd != ''
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd=${{ steps.root.outputs.cwd }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project Artifacts to Vercel
        if: steps.root.outputs.cwd != ''
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd=${{ steps.root.outputs.cwd }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
