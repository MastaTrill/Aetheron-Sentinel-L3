version: 2
updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github_actions"
      - "security"
    open-pull-requests-limit: 5

  # npm at repo root (if present)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "javascript"
      - "security"
    open-pull-requests-limit: 10

  # Remix dashboard
  - package-ecosystem: "npm"
    directory: "/apps/remix-dashboard"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "javascript"
      - "security"
    open-pull-requests-limit: 10

  # Imports remix package
  - package-ecosystem: "npm"
    directory: "/imports/remix_-aetheron-sentinel-l3"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "javascript"
      - "security"
    open-pull-requests-limit: 10

  # Python / pip (root requirements if any)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
      - "security"
    open-pull-requests-limit: 10

  # Foundry / git submodules
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "security"
