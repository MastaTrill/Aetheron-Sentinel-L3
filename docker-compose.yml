version: '3.8'

services:
  # Python Sentinel AI Threat Intelligence & On-Chain Monitor Gateway
  sentinel-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aetheron/sentinel-api:latest
    container_name: sentinel-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - NETWORK=baseSepolia
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Next.js Web Dashboard & DeFi Telemetry Interface
  sentinel-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: aetheron/sentinel-web:latest
    container_name: sentinel-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://sentinel-api:8000
    depends_on:
      - sentinel-api
